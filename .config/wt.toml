# Every worktree branches from develop (master is production). Before a switch,
# fast-forward the local develop to origin so a new worktree starts from the
# latest pushed work. The primary checkout may have develop checked out: then it
# fast-forwards there (refused if it would clobber local edits); otherwise the
# ref is updated directly. Never blocks the switch: offline or diverged, it warns.
# Needs `wt config state default-branch set develop` once per clone.
pre-switch = "p={{ primary_worktree_path }}; if [ \"$(git -C \"$p\" branch --show-current)\" = develop ]; then git -C \"$p\" pull -q --ff-only origin develop; else git -C \"$p\" fetch -q origin develop:develop; fi || echo '⚠ pre-switch: develop was not fast-forwarded; the new worktree may start behind origin.'"

# Blocks until the new worktree is ready: dependencies, the shared PostgreSQL,
# `.env.local`, and migrated databases (tooling/worktree/bootstrap-worktree.ts).
# Runs through mise so every worktree uses the bun/node pinned in mise.toml; a
# new worktree path is untrusted by mise until `mise trust` runs.
# Changing this command requires every developer to approve it again.
pre-start = "mise trust --yes && mise install && mise exec -- bun run worktree:bootstrap"

# Drops the removed worktree's three databases and deletes its storage bucket
# (runs in that worktree, which holds their identity). The primary checkout's copy of the script runs, so
# worktrees branched before it existed are cleaned too. Never blocks removal:
# the script only warns, and the fallback covers a primary that lacks it; in
# both cases `bun run db:prune` recovers later.
pre-remove = "mise exec -- bun {{ primary_worktree_path }}/tooling/worktree/remove-worktree-databases.ts || echo '⚠ worktree removal: database cleanup did not run; run bun run db:prune later.'"
