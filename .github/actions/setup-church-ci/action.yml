name: Setup Church CI environment
description: >-
  Install the Bun toolchain, install dependencies, and run database
  migrations. It writes no value file: every job injects its configuration
  through the job environment (ADR-0005). Runs after
  actions/checkout@v4, which callers must run first (a local composite action
  can't be loaded before the repo it lives in is checked out).

inputs:
  skip-migrate:
    description: >-
      Set to 'true' to skip the migration step. Deps/env setup here doesn't
      need a database, but migrations do — a caller whose database need is
      conditional (e.g. only when browser journeys are selected) skips this
      step and runs its own migration step once its database is actually up.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Cache bun dependencies
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Keep failure bundles in runner-temporary storage
      # ADR-0005: CI has no shared Git directory to keep bundles in; the
      # calling job uploads this directory only when it fails.
      shell: bash
      run: echo "CHURCH_FAILURE_BUNDLES_DIR=$RUNNER_TEMP/church-failure-bundles" >> "$GITHUB_ENV"

    - name: Run database migrations
      if: inputs.skip-migrate != 'true'
      shell: bash
      run: bun run db:migrate
