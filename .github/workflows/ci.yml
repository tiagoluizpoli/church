name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  develop-gate:
    name: Develop Gate (Fast + Affected)
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: church_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/church_test
      BETTER_AUTH_SECRET: ci-test-secret-key-minimum-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:5173
      UNLEASH_API_URL: http://localhost:4242/api
      UNLEASH_API_TOKEN: ci-test-token
      NODE_ENV: test
      ENABLE_DEBUG_ENDPOINTS: "true"
      TZ: Asia/Kolkata

    steps:
      - name: Record job start time
        run: echo "JOB_START_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-church-ci

      - name: Validation tests (affected-plan, date-time seam fixture)
        run: bun run test:validation

      - name: Determine affected plan
        id: plan
        run: |
          # Written under $RUNNER_TEMP, outside the repo working tree — the
          # later "Fast + affected gate" step re-runs the same planner, whose
          # changed-path scan includes untracked files (`git ls-files
          # --others`); a dump left inside the tree was picked up as a
          # "changed" file and fed into `bun run lint:files`, where Biome's
          # JSON formatter flagged its own array-formatting choices as a
          # lint violation — a debug artifact should never be lint-scoped
          # source in the first place.
          plan_file="$RUNNER_TEMP/affected-plan.json"
          bun tooling/validation/affected.ts --dry-run --daily-gate --base "origin/${{ github.base_ref }}" > "$plan_file"
          cat "$plan_file"
          needs_e2e=$(jq -r 'if .requiresFullE2e or ((.e2eSpecPaths | length) > 0) then "true" else "false" end' "$plan_file")
          echo "needs_e2e=$needs_e2e" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browsers
        if: steps.plan.outputs.needs_e2e == 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Fast + affected gate
        # --daily-gate: per #210's Implementation Decisions, a task-branch to
        # develop PR only ever requires the fast+affected gate — the full E2E
        # suite is release-gate-only (develop to master), gated on #121 being
        # repeatedly green, and that release gate (#222) doesn't exist yet. A
        # change to shared E2E infrastructure (e.g. playwright.config.ts)
        # still selects its normal mapped/critical-journey specs here; it
        # just never escalates to the full suite.
        run: bun run validate:affected -- --base "origin/${{ github.base_ref }}" --daily-gate

      - name: Record elapsed-time evidence
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START_TIME ))
          echo "### Develop gate elapsed time" >> "$GITHUB_STEP_SUMMARY"
          # Matches this job's `timeout-minutes: 10` budget above — keep both in sync.
          echo "${elapsed}s (target: 600s, job start to gate completion)" >> "$GITHUB_STEP_SUMMARY"

  fast-gate:
    name: Fast Gate
    if: github.event_name != 'pull_request' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: church_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/church_test
      BETTER_AUTH_SECRET: ci-test-secret-key-minimum-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:5173
      UNLEASH_API_URL: http://localhost:4242/api
      UNLEASH_API_TOKEN: ci-test-token
      NODE_ENV: test
      ENABLE_DEBUG_ENDPOINTS: "true"
      TZ: Asia/Kolkata

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-church-ci

      - name: Type check
        run: bun run typecheck

      - name: Lint (Biome + boundary enforcement)
        run: bun run lint

      - name: Validation tests (affected-plan, date-time seam fixture)
        run: bun run test:validation

      - name: Run tests with coverage
        run: bunx turbo test:unit test:integration -- --coverage

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: [fast-gate]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: church_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/church_e2e
      BETTER_AUTH_SECRET: ci-test-secret-key-minimum-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:4001
      VITE_SERVER_URL: http://localhost:3000
      UNLEASH_API_URL: http://localhost:4242/api
      UNLEASH_API_TOKEN: ci-test-token
      NODE_ENV: test
      ENABLE_DEBUG_ENDPOINTS: "true"
      TZ: Asia/Kolkata

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-church-ci

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E tests
        run: bun run test:e2e
