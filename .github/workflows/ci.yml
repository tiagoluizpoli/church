name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Fast Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: church_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/church_test
      BETTER_AUTH_SECRET: ci-test-secret-key-minimum-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:5173
      UNLEASH_API_URL: http://localhost:4242/api
      UNLEASH_API_TOKEN: ci-test-token
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint (Biome + boundary enforcement)
        run: bun run lint

      - name: Create .env for test runner
        run: |
          printf 'DATABASE_URL=%s\nBETTER_AUTH_SECRET=%s\nBETTER_AUTH_URL=%s\nCORS_ORIGIN=%s\nUNLEASH_API_URL=%s\nUNLEASH_API_TOKEN=%s\nNODE_ENV=test\n' \
            "$DATABASE_URL" "$BETTER_AUTH_SECRET" "$BETTER_AUTH_URL" \
            "$CORS_ORIGIN" "$UNLEASH_API_URL" "$UNLEASH_API_TOKEN" > .env

      - name: Run database migrations
        run: bun run db:migrate

      - name: Run tests with coverage
        run: bunx turbo test:unit test:integration --filter=server --only -- --coverage

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: [fast-gate]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: church_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/church_e2e
      BETTER_AUTH_SECRET: ci-test-secret-key-minimum-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:4001
      VITE_SERVER_URL: http://localhost:3000
      UNLEASH_API_URL: http://localhost:4242/api
      UNLEASH_API_TOKEN: ci-test-token
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Create .env for test runner
        run: |
          printf 'DATABASE_URL=%s\nBETTER_AUTH_SECRET=%s\nBETTER_AUTH_URL=%s\nCORS_ORIGIN=%s\nVITE_SERVER_URL=%s\nUNLEASH_API_URL=%s\nUNLEASH_API_TOKEN=%s\nNODE_ENV=test\n' \
            "$DATABASE_URL" "$BETTER_AUTH_SECRET" "$BETTER_AUTH_URL" \
            "$CORS_ORIGIN" "$VITE_SERVER_URL" "$UNLEASH_API_URL" "$UNLEASH_API_TOKEN" > .env

      - name: Run database migrations
        run: bun run db:migrate

      - name: Run E2E tests
        run: bun run test:e2e
