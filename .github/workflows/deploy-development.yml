name: Deploy Development

# A push to develop deploys that revision to the homelab once CI's required
# checks pass for it (#881). The checks themselves stay in ci.yml; this
# workflow only waits for them, so CI's own cancellation never interrupts a
# deployment. Runbook: docs/operations/deployments.md.

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  checks:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      checks: read
      contents: read
    outputs:
      deploy: ${{ steps.checks.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - id: checks
        name: Wait for the revision's required checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The check name is ci.yml's fast-gate job, the gate a develop push runs.
        run: bun run deploy:checks -- --revision="$GITHUB_SHA" --branch=develop --check="Fast Gate"

  images:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      server: ${{ steps.refs.outputs.server }}
      web: ${{ steps.refs.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: names
        name: Name the images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "server=ghcr.io/$owner/church-server" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$owner/church-web" >> "$GITHUB_OUTPUT"
      - id: server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/server.Dockerfile
          build-args: APP_REVISION=${{ github.sha }}
          tags: ${{ steps.names.outputs.server }}:${{ github.sha }}
          push: true
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/web.Dockerfile
          build-args: APP_REVISION=${{ github.sha }}
          tags: ${{ steps.names.outputs.web }}:${{ github.sha }}
          push: true
      - id: refs
        name: Record immutable digests
        env:
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          echo "server=${{ steps.names.outputs.server }}@$SERVER_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web=${{ steps.names.outputs.web }}@$WEB_DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy development
    needs: [checks, images]
    if: needs.checks.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Records the verified image set as a rollback target (#887).
    permissions:
      contents: read
      deployments: write
    # One deployment, migration or rollback per environment at a time. A
    # running one is never cancelled; a newer push replaces only a queued one.
    concurrency:
      group: deploy-development
      cancel-in-progress: false
    # The job's GitHub deployment is for this pushed revision and succeeds
    # only when the rollout command verified it.
    environment:
      name: development
      url: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      # The homelab (Dokploy and the development site) resolves publicly to its
      # LAN address. The job joins the tailnet and pins those names to the
      # homelab's tailnet IP, which the tailnet policy lets tag:ci reach on 443.
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Reach the homelab over the tailnet
        env:
          HOMELAB_TAILNET_IP: ${{ vars.HOMELAB_TAILNET_IP }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: |
          [ -n "$HOMELAB_TAILNET_IP" ] || { echo "Missing prerequisite: HOMELAB_TAILNET_IP"; exit 1; }
          for url in "$DOKPLOY_URL" "$PUBLIC_ORIGIN"; do
            host="${url#*://}"; host="${host%%[/:]*}"
            echo "$HOMELAB_TAILNET_IP $host" | sudo tee -a /etc/hosts
          done
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compose file for this revision
        # Development layers the private Mailpit inbox over the base topology.
        run: >-
          docker compose -f deployment/compose.yml -f deployment/compose.mailpit.yml
          config --no-interpolate --no-normalize > "$RUNNER_TEMP/compose.yml"
      - name: Back up, migrate, roll out and verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          CHURCH_BACKUP_ID: ${{ vars.CHURCH_BACKUP_ID }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          SERVER_IMAGE: ${{ needs.images.outputs.server }}
          WEB_IMAGE: ${{ needs.images.outputs.web }}
        run: >-
          bun run deploy:rollout --
          --environment=development
          --revision="$GITHUB_SHA"
          --server-image="$SERVER_IMAGE"
          --web-image="$WEB_IMAGE"
          --compose-file="$RUNNER_TEMP/compose.yml"
