name: Sync wayfinder project status

on:
  issues:
    types: [closed, reopened]
  workflow_dispatch: {}

jobs:
  recompute-status:
    name: Recompute Backlog/Ready from issue dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run recompute
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: bash .github/scripts/sync-wayfinder-status.sh
