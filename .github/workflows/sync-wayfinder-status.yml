name: Sync wayfinder project status

on:
  issues:
    types: [closed, reopened]
  workflow_dispatch: {}

jobs:
  recompute-status:
    name: Recompute Backlog/Ready from issue dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run recompute
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: bash .github/scripts/sync-wayfinder-status.sh
