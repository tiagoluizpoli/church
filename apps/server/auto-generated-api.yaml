                        - roleId
                        - requiredCount
                      additionalProperties: false
                required:
                  - id
                  - churchId
                  - eventId
                  - startTime
                  - endTime
                  - status
                  - requirements
                additionalProperties: false
    delete:
      tags: [admin]
      operationId: deleteSlot
      parameters:
        - schema:
            type: string
          in: path
          name: eventId
          required: true
        - schema:
            type: string
          in: path
          name: slotId
          required: true
      responses:
        "200":
          description: Default Response
  /api/v1/admin/events/{eventId}/slots/generate:
    post:
      tags: [admin]
      operationId: generateSlots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                strategy:
                  oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                            - equal-split
                        slotDurationMinutes:
                          type: integer
                          exclusiveMinimum: true
                          maximum: 9007199254740991
                      required:
                        - kind
                        - slotDurationMinutes
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                            - template-based
                        periods:
                          type: array
                          items:
                            type: object
                            properties:
                              label:
                                type: string
                              startTime:
                                type: string
                                format: date-time
                                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                              endTime:
                                type: string
                                format: date-time
                                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                              requirements:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    roleId:
                                      type: string
                                    teamId:
                                      type: string
                                    requiredCount:
                                      type: integer
                                      exclusiveMinimum: true
                                      maximum: 9007199254740991
                                    notes:
                                      type: string
                                  required:
                                    - roleId
                                    - requiredCount
                            required:
                              - label
                              - startTime
                              - endTime
                      required:
                        - kind
                        - periods
              required:
                - strategy
      parameters:
        - schema:
            type: string
          in: path
          name: eventId
          required: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        churchId:
                          type: string
                        eventId:
                          type: string
                        startTime:
                          type: string
                        endTime:
                          type: string
                        label:
                          type: string
                        status:
                          type: string
                          enum:
                            - active
                            - cancelled
                        requirements:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              slotId:
                                type: string
                              roleId:
                                type: string
                              teamId:
                                type: string
                              requiredCount:
                                type: number
                              notes:
                                type: string
                            required:
                              - id
                              - slotId
                              - roleId
                              - requiredCount
                            additionalProperties: false
                      required:
                        - id
                        - churchId
                        - eventId
                        - startTime
                        - endTime
                        - status
                        - requirements
                      additionalProperties: false
                required:
                  - slots
                additionalProperties: false
