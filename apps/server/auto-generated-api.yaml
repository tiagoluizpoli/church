openapi: 3.0.3
info:
  title: Church API
  version: 1.0.0
components:
  schemas: {}
paths:
  /api/auth/{*}:
    get: &a1
      parameters:
        - schema:
            type: string
          in: path
          name: "*"
          required: true
      responses:
        "200":
          description: Default Response
    post: *a1
  /api/v1/admin/ministries:
    get:
      tags: [admin]
      operationId: listMinistries
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ministries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        churchId:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        enforcementType:
                          type: string
                          enum:
                            - soft
                            - hard
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                      required:
                        - id
                        - churchId
                        - name
                        - enforcementType
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                required:
                  - ministries
                additionalProperties: false
  /api/v1/admin/schedule-builder:
    get:
      tags: [admin]
      operationId: getScheduleBuilderData
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        event:
                          type: object
                          properties:
                            id:
                              type: string
                            churchId:
                              type: string
                            ministryId:
                              type: string
                            title:
                              type: string
                            description:
                              type: string
                            location:
                              type: string
                            startDate:
                              type: string
                            endDate:
                              type: string
                            status:
                              type: string
                              enum:
                                - draft
                                - published
                                - cancelled
                                - past
                            eventType:
                              type: string
                              enum:
                                - hourly
                                - day_based
                            createdAt:
                              type: string
                            updatedAt:
                              type: string
                          required:
                            - id
                            - churchId
                            - ministryId
                            - title
                            - startDate
                            - endDate
                            - status
                            - eventType
                            - createdAt
                            - updatedAt
                          additionalProperties: false
                        slots:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              churchId:
                                type: string
                              eventId:
                                type: string
                              startTime:
                                type: string
                              endTime:
                                type: string
                              label:
                                type: string
                              status:
                                type: string
                                enum:
                                  - active
                                  - cancelled
                              requirements:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                    slotId:
                                      type: string
                                    roleId:
                                      type: string
                                    teamId:
                                      type: string
                                    requiredCount:
                                      type: number
                                    notes:
                                      type: string
                                  required:
                                    - id
                                    - slotId
                                    - roleId
                                    - requiredCount
                                  additionalProperties: false
                            required:
                              - id
                              - churchId
                              - eventId
                              - startTime
                              - endTime
                              - status
                              - requirements
                            additionalProperties: false
                      required:
                        - event
                        - slots
                      additionalProperties: false
                  assignments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        churchId:
                          type: string
                        slotId:
                          type: string
                        volunteerId:
                          type: string
                        roleId:
                          type: string
                        status:
                          type: string
                          enum:
                            - draft
                            - pending
                            - confirmed
                            - declined
                            - cancelled
                        reason:
                          type: string
                        assignedAt:
                          type: string
                        assignedBy:
                          type: string
                      required:
                        - id
                        - churchId
                        - slotId
                        - volunteerId
                        - roleId
                        - status
                        - assignedAt
                      additionalProperties: false
                  availability:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        volunteerId:
                          type: string
                        type:
                          type: string
                          enum:
                            - available
                            - unavailable
                        startTime:
                          type: string
                        endTime:
                          type: string
                        isAllDay:
                          type: boolean
                      required:
                        - id
                        - volunteerId
                        - type
                        - startTime
                        - endTime
                        - isAllDay
                      additionalProperties: false
                  volunteers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                      required:
                        - id
                        - name
                      additionalProperties: false
                required:
                  - events
                  - assignments
                  - availability
                  - volunteers
                additionalProperties: false
  /api/v1/admin/events:
    get:
      tags: [admin]
      operationId: listEvents
      parameters:
        - schema:
            type: string
          in: query
          name: ministryId
          required: true
        - schema:
            type: string
            enum:
              - draft
              - published
              - cancelled
              - past
          in: query
          name: status
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        churchId:
                          type: string
                        ministryId:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        location:
                          type: string
                        startDate:
                          type: string
                        endDate:
                          type: string
                        status:
                          type: string
                          enum:
                            - draft
                            - published
                            - cancelled
                            - past
                        eventType:
                          type: string
                          enum:
                            - hourly
                            - day_based
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                      required:
                        - id
                        - churchId
                        - ministryId
                        - title
                        - startDate
                        - endDate
                        - status
                        - eventType
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                required:
                  - events
                additionalProperties: false
    post:
      tags: [admin]
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ministryId:
                  type: string
                title:
                  type: string
                  minLength: 1
                description:
                  type: string
                location:
                  type: string
                startDate:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                endDate:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                eventType:
                  type: string
                  enum:
                    - hourly
                    - day_based
              required:
                - ministryId
                - title
                - startDate
                - endDate
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  churchId:
                    type: string
                  ministryId:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  location:
                    type: string
                  startDate:
                    type: string
                  endDate:
                    type: string
                  status:
                    type: string
                    enum:
                      - draft
                      - published
                      - cancelled
                      - past
                  eventType:
                    type: string
                    enum:
                      - hourly
                      - day_based
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                required:
                  - id
                  - churchId
                  - ministryId
                  - title
                  - startDate
                  - endDate
                  - status
                  - eventType
                  - createdAt
                  - updatedAt
                additionalProperties: false
  /api/v1/admin/events/{eventId}/publish:
    post:
      tags: [admin]
      operationId: publishEvent
      parameters:
        - schema:
            type: string
          in: path
          name: eventId
          required: true
      responses:
        "200":
          description: Default Response
  /api/v1/admin/events/{eventId}/cancel:
