                teamId:
                  type: string
                requiredCount:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
                notes:
                  type: string
              required:
                - roleId
                - requiredCount
      parameters:
        - schema:
            type: string
          in: path
          name: eventId
          required: true
        - schema:
            type: string
          in: path
          name: slotId
