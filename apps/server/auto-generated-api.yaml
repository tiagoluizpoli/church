openapi: 3.0.3
info:
  title: Church API
  version: 1.0.0
components:
  schemas: {}
paths:
  /api/auth/{*}:
    get: &a1
      parameters:
        - schema:
            type: string
          in: path
          name: "*"
          required: true
      responses:
        "200":
          description: Default Response
    post: *a1
  /api/v1/active-church/status:
    get:
      operationId: getActiveChurchStatus
      tags:
        - active-church
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - resolved
                      - selection_required
                      - no_membership
                  churchId:
                    type: string
                  membershipRemovedFrom:
                    type: string
                required:
                  - status
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
                additionalProperties: false
  /api/v1/active-church/options:
    get:
      operationId: listActiveChurchOptions
      tags:
        - active-church
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  churches:
                    type: array
                    items:
                      type: object
                      properties:
                        churchId:
                          type: string
                        name:
                          type: string
                        timezone:
                          type: string
                        accessLevel:
                          type: string
                          enum:
                            - member
                            - admin
                        availableAreas:
                          type: array
                          items:
                            type: string
                            enum:
                              - dashboard
                              - scheduling
                        lastOpenedAt:
                          nullable: true
                          type: string
                      required:
                        - churchId
                        - name
                        - timezone
                        - accessLevel
                        - availableAreas
                        - lastOpenedAt
                      additionalProperties: false
                required:
                  - churches
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
                additionalProperties: false
  /api/v1/active-church/select:
    post:
      operationId: selectActiveChurch
      tags:
        - active-church
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                churchId:
                  type: string
              required:
                - churchId
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - resolved
                      - selection_required
                      - no_membership
                  churchId:
                    type: string
                  membershipRemovedFrom:
                    type: string
                required:
                  - status
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
                additionalProperties: false
  /api/v1/admin/ministries:
    get:
      operationId: listMinistries
      tags:
        - admin
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ministries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        churchId:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        enforcementType:
                          type: string
                          enum:
                            - soft
                            - hard
                        defaultDirection:
                          type: string
                          enum:
                            - all_in
                            - all_out
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                      required:
                        - id
                        - churchId
                        - name
                        - enforcementType
                        - defaultDirection
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                required:
                  - ministries
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
                additionalProperties: false
  /api/v1/admin/ministries/{ministryId}/invitations:
    post:
      operationId: mintMinistryInvitation
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                ministryAccessLevel:
                  type: string
                  enum:
                    - leader
                    - volunteer
                roleIds:
                  type: array
                  items:
                    type: string
              required:
                - email
                - ministryAccessLevel
                - roleIds
      parameters:
        - schema:
            type: string
          in: path
          name: ministryId
          required: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  kind:
                    type: string
                    enum:
                      - ministry-only
                      - chained
                  status:
                    type: string
                    enum:
                      - pending
                      - accepted
                      - rejected
                      - canceled
                  expiresAt:
                    type: string
                  redemptionPath:
                    type: string
                  deliveryStatus:
                    type: string
                    enum:
                      - pending
                      - sent
                      - failed
                required:
                  - id
                  - kind
                  - status
                  - expiresAt
                  - redemptionPath
                  - deliveryStatus
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
                additionalProperties: false
  /api/v1/admin/ministries/{ministryId}/invitations/{invitationId}/resend:
    post:
      operationId: resendMinistryInvitation
      tags:
        - admin
      parameters:
        - schema:
            type: string
          in: path
          name: ministryId
          required: true
        - schema:
            type: string
          in: path
          name: invitationId
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  kind:
                    type: string
                    enum:
                      - ministry-only
                      - chained
                  status:
                    type: string
                    enum:
                      - pending
                      - accepted
                      - rejected
                      - canceled
                  expiresAt:
                    type: string
                  redemptionPath:
                    type: string
                  deliveryStatus:
                    type: string
                    enum:
                      - pending
                      - sent
                      - failed
                required:
                  - id
                  - kind
                  - status
                  - expiresAt
                  - redemptionPath
                  - deliveryStatus
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
                additionalProperties: false
  /api/v1/admin/schedule-builder:
    get:
      operationId: getScheduleBuilderData
      tags:
        - admin
      parameters:
        - schema:
            type: string
          in: query
          name: eventId
          required: true
        - schema:
            type: string
          in: query
          name: ministryId
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        event:
                          type: object
                          properties:
                            id:
                              type: string
                            churchId:
                              type: string
                            planningCycleId:
                              type: string
                            sourceTemplateId:
                              type: string
                            title:
                              type: string
                            description:
                              type: string
                            location:
                              type: string
                            startDate:
                              type: string
                            endDate:
                              type: string
                            status:
                              type: string
                              enum:
                                - draft
                                - scheduled
                                - cancelled
                                - past
                            eventType:
                              type: string
                              enum:
                                - hourly
                                - day_based
                            createdAt:
                              type: string
                            updatedAt:
                              type: string
                          required:
                            - id
                            - churchId
                            - planningCycleId
                            - title
                            - startDate
                            - endDate
                            - status
                            - eventType
                            - createdAt
                            - updatedAt
                          additionalProperties: false
                        slots:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              churchId:
                                type: string
                              eventId:
                                type: string
                              startTime:
                                type: string
                              endTime:
                                type: string
                              label:
                                type: string
                              status:
                                type: string
                                enum:
                                  - active
                                  - cancelled
                              requirements:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                    slotId:
                                      type: string
                                    roleId:
                                      type: string
                                    teamId:
                                      type: string
                                    requiredCount:
                                      type: number
                                    notes:
                                      type: string
                                  required:
                                    - id
                                    - slotId
                                    - roleId
                                    - requiredCount
                                  additionalProperties: false
                            required:
                              - id
                              - churchId
                              - eventId
                              - startTime
                              - endTime
                              - status
                              - requirements
                            additionalProperties: false
                      required:
                        - event
                        - slots
                      additionalProperties: false
                  assignments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        churchId:
                          type: string
                        slotId:
                          type: string
                        participationId:
                          type: string
                        shiftId:
                          type: string
                        volunteerId:
                          type: string
                        roleId:
                          type: string
                        status:
                          type: string
                          enum:
                            - draft
                            - pending
                            - confirmed
                            - declined
                            - cancelled
                        reason:
                          type: string
                        assignedAt:
                          type: string
                        assignedBy:
                          type: string
                      required:
                        - id
                        - churchId
                        - slotId
                        - volunteerId
                        - roleId
                        - status
                        - assignedAt
                      additionalProperties: false
                  availability:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        volunteerId:
                          type: string
                        type:
                          type: string
                          enum:
                            - available
                            - unavailable
                        startTime:
                          type: string
                        endTime:
                          type: string
                        isAllDay:
                          type: boolean
                      required:
                        - id
                        - volunteerId
                        - type
                        - startTime
                        - endTime
                        - isAllDay
                      additionalProperties: false
                  volunteers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        ministryAccessLevel:
                          type: string
                          enum:
                            - leader
                            - volunteer
                        qualifiedRoleIds:
                          type: array
                          items:
                            type: string
                        teamIds:
                          type: array
                          items:
                            type: string
                        leadTeamIds:
                          type: array
                          items:
                            type: string
                      required:
                        - id
                        - name
                        - ministryAccessLevel
                        - qualifiedRoleIds
                        - teamIds
                        - leadTeamIds
                      additionalProperties: false
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                      required:
                        - id
                        - name
                      additionalProperties: false
                  callerTeamIds:
                    nullable: true
                    type: array
                    items:
                      type: string
                required:
                  - events
                  - assignments
                  - availability
                  - volunteers
                  - roles
                  - callerTeamIds
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
                additionalProperties: false
  /api/v1/admin/events:
    get:
      operationId: listEvents
      tags:
        - admin
      parameters:
        - schema:
            type: string
          in: query
          name: ministryId
          required: true
        - schema:
            type: string
            enum:
              - draft
              - scheduled
              - cancelled
              - past
          in: query
          name: status
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        churchId:
                          type: string
                        planningCycleId:
                          type: string
                        sourceTemplateId:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        location:
                          type: string
                        startDate:
                          type: string
                        endDate:
                          type: string
                        status:
                          type: string
                          enum:
                            - draft
                            - scheduled
                            - cancelled
                            - past
                        eventType:
                          type: string
                          enum:
                            - hourly
                            - day_based
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                      required:
                        - id
                        - churchId
                        - planningCycleId
                        - title
                        - startDate
                        - endDate
                        - status
                        - eventType
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                required:
                  - events
                additionalProperties: false
  /api/v1/admin/events/{eventId}/cancel:
    post:
      operationId: cancelEvent
      tags:
        - admin
      parameters:
        - schema:
            type: string
          in: path
          name: eventId
          required: true
      responses:
        "200":
          description: Default Response
  /api/v1/admin/events/{eventId}/reminders:
    post:
      operationId: sendReminders
      tags:
        - admin
      parameters:
        - schema:
            type: string
          in: path
          name: eventId
          required: true
      responses:
        "200":
          description: Default Response
  /api/v1/admin/events/{eventId}/slots:
    post:
      operationId: createSlot
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startTime:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                endTime:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                label:
                  type: string
              required:
                - startTime
                - endTime
      parameters:
        - schema:
            type: string
          in: path
          name: eventId
          required: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  churchId:
                    type: string
                  eventId:
                    type: string
                  startTime:
                    type: string
                  endTime:
                    type: string
                  label:
                    type: string
                  status:
                    type: string
                    enum:
                      - active
                      - cancelled
                  requirements:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        slotId:
                          type: string
                        roleId:
                          type: string
                        teamId:
                          type: string
                        requiredCount:
                          type: number
                        notes:
                          type: string
                      required:
                        - id
                        - slotId
                        - roleId
                        - requiredCount
                      additionalProperties: false
                required:
                  - id
                  - churchId
                  - eventId
                  - startTime
                  - endTime
                  - status
                  - requirements
                additionalProperties: false
  /api/v1/admin/events/{eventId}/slots/{slotId}:
    patch:
      operationId: updateSlot
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startTime:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                endTime:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                label:
                  type: string
      parameters:
        - schema:
            type: string
          in: path
          name: eventId
          required: true
        - schema:
            type: string
          in: path
          name: slotId
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  churchId:
                    type: string
                  eventId:
                    type: string
                  startTime:
                    type: string
                  endTime:
                    type: string
                  label:
                    type: string
                  status:
                    type: string
                    enum:
                      - active
                      - cancelled
                  requirements:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        slotId:
                          type: string
                        roleId:
                          type: string
                        teamId:
                          type: string
                        requiredCount:
                          type: number
                        notes:
                          type: string
                      required:
                        - id
                        - slotId
                        - roleId
                        - requiredCount
                      additionalProperties: false
                required:
                  - id
                  - churchId
                  - eventId
                  - startTime
                  - endTime
                  - status
                  - requirements
                additionalProperties: false
    delete:
      operationId: deleteSlot
      tags:
        - admin
      parameters:
        - schema:
            type: string
          in: path
          name: eventId
          required: true
        - schema:
            type: string
          in: path
          name: slotId
          required: true
      responses:
        "200":
          description: Default Response
  /api/v1/admin/assignments/{assignmentId}/override:
    post:
      operationId: overrideAssignment
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 10
              required:
                - reason
      parameters:
        - schema:
            type: string
          in: path
          name: assignmentId
          required: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  overridden:
                    type: boolean
                    enum:
                      - true
                required:
                  - overridden
                additionalProperties: false
  /api/v1/admin/events/{eventId}/slots/generate:
    post:
      operationId: generateSlots
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                strategy:
                  oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                            - equal-split
                        slotDurationMinutes:
                          type: integer
                          exclusiveMinimum: true
                          maximum: 9007199254740991
                      required:
                        - kind
                        - slotDurationMinutes
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                            - template-based
                        periods:
                          type: array
                          items:
                            type: object
                            properties:
                              label:
                                type: string
                              startTime:
                                type: string
                                format: date-time
                                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                              endTime:
                                type: string
                                format: date-time
                                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                              requirements:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    roleId:
                                      type: string
                                    teamId:
                                      type: string
                                    requiredCount:
                                      type: integer
                                      exclusiveMinimum: true
                                      maximum: 9007199254740991
                                    notes:
                                      type: string
                                  required:
                                    - roleId
                                    - requiredCount
                            required:
                              - label
                              - startTime
                              - endTime
                      required:
                        - kind
                        - periods
              required:
                - strategy
      parameters:
        - schema:
            type: string
          in: path
          name: eventId
          required: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
