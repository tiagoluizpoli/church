      operationId: cancelEvent
      parameters:
        - schema:
            type: string
          in: path
          name: eventId
          required: true
      responses:
        "200":
          description: Default Response
  /api/v1/admin/events/{eventId}/reminders:
    post:
      tags: [admin]
      operationId: sendReminders
      parameters:
        - schema:
            type: string
          in: path
