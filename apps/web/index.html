<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>base-fullstack-template</title>
    <!-- The first-paint stylesheet (src/first-paint.css), inlined by tooling/vite/first-paint.ts:
         theme colours, page background, AuthShell's frame and the scene stills. -->
    <!-- first-paint.css -->
    <!-- Runs before the first paint, which is why it is here and not in the bundle:
         the theme next-themes would pick (same storage key, same default), the
         locale the app will resolve, and on a sign-in route the boot shell below. -->
    <script>
      (() => {
        const root = document.documentElement;
        let theme = "light";
        try {
          theme = localStorage.getItem("vite-ui-theme") || theme;
        } catch {}
        if (theme === "system") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        root.classList.add(theme);
        root.style.colorScheme = theme;

        // As initLocale and the Paraglide strategy resolve it: a valid ?lang=,
        // else the locale cookie (any case), else the app's default.
        const config = {} /* first-paint:config */;
        const search = new URLSearchParams(location.search);
        const query = search.get(config.queryParam);
        const cookie = document.cookie.match(
          new RegExp(`(?:^|;\\s*)${config.cookieName}=([^;]*)`),
        )?.[1];
        const locale = config.locales.includes(query)
          ? query
          : config.locales.find((code) => code.toLowerCase() === cookie?.toLowerCase()) ||
            config.defaultLocale;
        root.lang = locale;

        // Each AuthShell route in the state a fresh load shows; any other state
        // (the password-changed notice, an expired reset link) skips the shell.
        const path = location.pathname.replace(/(.)\/$/, "$1");
        const route =
          path === "/login"
            ? search.get("notice") !== "password-changed" && "login"
            : path === "/forgot-password"
              ? "forgot-password"
              : path === "/reset-password" && search.get("token") && !search.get("error")
                ? "reset-password"
                : "";
        if (!route) return;
        root.dataset.bootShell = route;
        window.bootShellCopy = config.messages[locale];
        // A start that fails (the entry or a module it imports fails to load or
        // throws) must not leave the shell over the page.
        addEventListener(
          "error",
          (event) => {
            const script = event.target instanceof HTMLScriptElement && event.target.type === "module";
            if (script || (event instanceof ErrorEvent && event.error != null)) {
              document.getElementById("boot-shell")?.remove();
            }
          },
          true,
        );
      })();
    </script>
    <style>
      /* The boot shell: AuthShell's frame (first-paint.css) over the page until
         AuthShell mounts and removes it, with the form outlined in bars set in
         the form's real copy, so they wrap and size as the form will. The rules
         below mirror the forms' Tailwind classes; the boot-shell e2e spec fails
         when a bar no longer lands on its element. */
      body {
        margin: 0;
      }
      #boot-shell {
        display: none;
      }
      [data-boot-shell] #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        background: inherit;
      }
      .boot-form {
        display: none;
        --boot-bar: color-mix(in oklch, var(--foreground) 9%, transparent);
        font: 1rem / 1.5 var(--font-ui);
        color: transparent;
      }
      [data-boot-shell="login"] .boot-form[data-form="login"],
      [data-boot-shell="forgot-password"] .boot-form[data-form="forgot-password"],
      [data-boot-shell="reset-password"] .boot-form[data-form="reset-password"] {
        display: block;
      }
      .boot-form [data-m] {
        border-radius: 4px;
        /* Not box-decoration-break: clone, which changes how text-wrap: pretty breaks. */
        background: var(--boot-bar);
      }
      .boot-form [data-m],
      .boot-input,
      .boot-button {
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-form h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: calc(2 / 1.5);
        font-weight: 700;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }
      .boot-form p {
        margin: 0.5rem 0 2rem;
        font-size: 0.875rem;
        line-height: 1.625;
        text-wrap: pretty;
      }
      .boot-form h1.boot-heading-only {
        margin-bottom: 2rem;
      }
      .boot-fields > :not(:last-child) {
        margin-bottom: 1.25rem;
      }
      .boot-label {
        margin-bottom: 0.5rem;
        font-size: 0.75rem;
        line-height: 1;
      }
      .boot-input,
      .boot-button {
        display: block;
        height: 2.75rem;
        border-radius: calc(var(--radius) * 0.8);
      }
      .boot-input {
        box-shadow: inset 0 0 0 1px var(--input);
      }
      /* SignInForm's email field keeps the 0.5rem gap above its (empty) error
         line, as its input is inline-block; the password input's wrapper is a
         block, whose gap collapses away. Padding, so it cannot collapse here. */
      .boot-errors {
        padding-bottom: 0.5rem;
      }
      .boot-link {
        margin-top: -0.25rem;
        text-align: right;
      }
      .boot-link > span {
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .boot-submit {
        padding-top: 0.25rem;
      }
      .boot-button {
        background: color-mix(in oklch, var(--primary) 28%, transparent);
      }
      .boot-back {
        margin-top: 1.5rem;
      }
      .boot-back > span {
        display: inline-flex;
        align-items: center;
        height: 2rem;
        border: 1px solid transparent;
        font-size: 0.75rem;
        line-height: 1rem;
        font-weight: 500;
        white-space: nowrap;
      }
      @media (width >= 48rem) {
        .boot-form h1 {
          font-size: 1.75rem;
        }
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-form [data-m],
        .boot-input,
        .boot-button {
          animation: none;
        }
      }
    </style>
    <!-- Not render-blocking: text paints in the fallback font and swaps when these arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      onload="this.onload = null; this.rel = 'stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>

  <body>
    <div id="app"></div>
    <div id="boot-shell" class="auth-shell" aria-hidden="true">
      <div class="auth-shell-panel dark"><div class="sanctuary-light-backdrop"><div class="sanctuary-light-still"></div></div></div>
      <div class="auth-shell-form">
        <!-- Each mirrors its form's markup (components/sign-in-form.tsx and the password forms). -->
        <div class="auth-shell-form-body boot-form" data-form="login">
          <h1><span data-m="auth_sign_in_title"></span></h1>
          <p><span data-m="auth_sign_in_invitation_only"></span></p>
          <div class="boot-fields">
            <div class="boot-errors"><div class="boot-label"><span data-m="password_recovery_email_label"></span></div><i class="boot-input"></i></div>
            <div><div class="boot-label"><span data-m="auth_password_label"></span></div><i class="boot-input"></i></div>
            <div class="boot-link"><span data-m="password_recovery_forgot_link"></span></div>
            <div class="boot-submit"><i class="boot-button"></i></div>
          </div>
        </div>
        <div class="auth-shell-form-body boot-form" data-form="forgot-password">
          <h1><span data-m="password_recovery_request_title"></span></h1>
          <p><span data-m="password_recovery_request_description"></span></p>
          <div class="boot-fields">
            <div><div class="boot-label"><span data-m="password_recovery_email_label"></span></div><i class="boot-input"></i></div>
            <i class="boot-button"></i>
          </div>
          <div class="boot-back"><span><span data-m="password_recovery_back_to_login"></span></span></div>
        </div>
        <div class="auth-shell-form-body boot-form" data-form="reset-password">
          <h1 class="boot-heading-only"><span data-m="password_recovery_reset_title"></span></h1>
          <div class="boot-fields">
            <div><div class="boot-label"><span data-m="password_recovery_new_password_label"></span></div><i class="boot-input"></i></div>
            <i class="boot-button"></i>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const copy = window.bootShellCopy;
        delete window.bootShellCopy;
        if (!copy) return;
        const shell = document.getElementById("boot-shell");
        for (const element of shell.querySelectorAll("[data-m]")) {
          element.textContent = copy[element.dataset.m];
        }
        // The still first-paint.css's container queries pick for this panel, at
        // the priority a background image would not get on its own.
        const still = /url\("?(.+?)"?\)/.exec(
          getComputedStyle(shell.querySelector(".sanctuary-light-still")).backgroundImage,
        )?.[1];
        if (!still) return;
        const preload = document.createElement("link");
        preload.rel = "preload";
        preload.as = "image";
        preload.fetchPriority = "high";
        preload.href = still;
        document.head.append(preload);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
