# Development and staging only: layer over compose.yml
#   docker compose -f compose.yml -f compose.mailpit.yml ...
# Never use it for production, which always sends through Resend.
#
# Adds a private Mailpit capture inbox and points the server's mode-routing
# sender at it. runtime_configuration.email_delivery_mode then selects
# mailpit, resend or both per email (docs/deployment/email-delivery.md).

services:
  server:
    environment:
      CHURCH_ENVIRONMENT: ${CHURCH_ENVIRONMENT:?CHURCH_ENVIRONMENT must be development or staging}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAILPIT_API_URL: http://mailpit:8025
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      # Captured login codes and invitations are deleted after seven days.
      MP_MAX_AGE: 7d
    # SMTP stays on the project network. The inbox is published only on the
    # host's Tailscale address, so it is reachable from the tailnet alone;
    # it has no Dokploy domain and no public route.
    ports:
      - "${MAILPIT_TAILSCALE_IP:?MAILPIT_TAILSCALE_IP is required}:8025:8025"
    volumes:
      - mailpit-data:/data
    networks: [default]

volumes:
  mailpit-data:
