server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # API and Better Auth share the page's origin; `server` resolves only on the
  # Compose project's own network (see deployment/README.md).
  location /api/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # The frontend's build revision, read by deployment health checks.
  location = /revision.txt {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
