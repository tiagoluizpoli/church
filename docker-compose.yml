# Development dependencies (ADR-0005): the only Compose entrypoint for local
# PostgreSQL, shared by every worktree through the primary checkout's copy
# (`bun run db:start`), and this machine's opt-in development resolver
# (`bun run dns:start`).
# The fixed project name keeps service, network, and volume identity stable.
name: church

services:
  db:
    image: postgres:16-alpine
    container_name: church-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-church}
    ports:
      - "5444:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-church}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local SMTP inbox for development email (DEV_EMAIL_SENDER=smtp, the default).
  # SMTP on 1025, web inbox on 8025 of every host interface (reach it at the
  # machine's IP). Messages persist in the volume; nothing is relayed.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: church-mailpit
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit-data:/data

  # Answers only `*.<CHURCH_DEV_DOMAIN>` for this machine's worktree URLs.
  # The profile keeps db:start (and bootstrap), CI and E2E from starting it;
  # `bun run dns:start` renders its config and supplies both values below.
  dns:
    profiles: [dns]
    build: tooling/dns
    image: church-dns
    container_name: church-dns
    restart: unless-stopped
    ports:
      - "${CHURCH_DEV_ADDRESS:-127.0.0.1}:53:53/udp"
      - "${CHURCH_DEV_ADDRESS:-127.0.0.1}:53:53/tcp"
    volumes:
      - type: bind
        source: ${CHURCH_DNS_CONFIG:-./.git/church-dnsmasq.conf}
        target: /etc/dnsmasq.conf
        read_only: true
        bind:
          create_host_path: false

volumes:
  postgres-data:
  mailpit-data:
