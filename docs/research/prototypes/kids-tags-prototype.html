<!doctype html>
<!--
  PROTOTYPE, throwaway (wayfinder ticket #1084). Never merged.
  Question: how should the Child tag and the Guardian tag look?
  Three layouts (A/B/C) x two stocks (29x90 DK-1201, 62x100 DK-1202) x three Care stamp styles x three cases.
  Tags render at real mm size; Ctrl+P / "Imprimir" prints one tag per page at the label size (the printer emulator).
  QR codes are fake placeholders at the real size, not scannable. Thermal stock is black only, so no colour.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · Etiquetas Kids</title>
<style id="page-size"></style>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #e6e3dc; color: #222; }
  .controls { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid #bbb;
    padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; font-size: 14px; }
  .controls fieldset { border: 0; padding: 0; margin: 0; display: flex; gap: 8px; align-items: center; }
  .controls legend { float: left; font-weight: 600; margin-right: 6px; }
  .state { font: 12px ui-monospace, monospace; color: #555; padding: 6px 14px; }
  .legend { font-size: 13px; padding: 0 14px; display: flex; gap: 16px; align-items: center; }
  .legend .stamp { width: 6mm; height: 6mm; }
  .sheet { padding: 18px 14px 80px; display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
  .slot h3 { font-size: 12px; font-weight: 600; color: #555; margin: 0 0 4px; }

  /* ---- the tag itself: everything below is what a printing module would reproduce ---- */
  .tag { zoom: var(--zoom, 2.5); background: #fff; color: #000; box-shadow: 0 1px 4px rgba(0,0,0,.3);
    font-family: Arial, Helvetica, sans-serif; overflow: hidden; box-sizing: border-box; display: grid;
    padding: 1.5mm; gap: 0.8mm 1.5mm; }
  .s29 .tag { width: 90mm; height: 29mm; }
  .s62 .tag { width: 100mm; height: 62mm; padding: 2.5mm; gap: 1.5mm 2.5mm; }
  .tag > * { min-width: 0; min-height: 0; }
  .name { grid-area: name; font-weight: 700; white-space: nowrap; overflow: hidden; line-height: 1.05; }
  .meta { grid-area: meta; font-size: 2.6mm; white-space: nowrap; overflow: hidden; }
  .s62 .meta { font-size: 3.6mm; }
  .care { grid-area: care; display: flex; gap: 1mm; align-items: center; overflow: hidden; }
  .note { font-size: 2.6mm; font-weight: 700; line-height: 1.15; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .s62 .note { font-size: 3.6mm; -webkit-line-clamp: 3; }
  .call { grid-area: call; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 0.5mm solid #000; border-radius: 1mm; padding: 0 1.2mm; line-height: 1; }
  .call small { font-size: 2mm; font-weight: 700; }
  .call b { font-size: 6mm; }
  .s62 .call small { font-size: 3mm; }
  .s62 .call b { font-size: 10mm; }
  .qr { grid-area: qr; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .qr svg { flex: 1 1 auto; min-height: 0; width: 100%; }
  .qr .code { font: 700 3.4mm ui-monospace, "Courier New", monospace; letter-spacing: .6mm; }
  .s62 .qr .code { font-size: 5mm; }
  .qr .cap { font-size: 1.8mm; }
  .s62 .qr .cap { font-size: 2.6mm; }
  .claim { display: flex; gap: 1mm; align-items: center; height: 100%; }
  .claim svg { height: 100%; max-height: 13mm; aspect-ratio: 1; flex: none; }
  .s62 .claim svg { max-height: 18mm; }
  .claim span { font-size: 2.2mm; line-height: 1.15; }
  .s62 .claim span { font-size: 3.2mm; }
  .stamp { width: 4.2mm; height: 4.2mm; flex: none; }
  .s62 .stamp { width: 6.5mm; height: 6.5mm; }
  .keep { font-weight: 700; }

  /* A: Nome primeiro. The name leads, QR on the right. */
  .s29 .vA { grid-template: auto auto 1fr / 1fr auto 26mm; grid-template-areas: "name call qr" "meta meta qr" "care care qr"; }
  .s62 .vA { grid-template: auto auto auto 1fr / 1fr 36mm; grid-template-areas: "name name" "call qr" "meta qr" "care qr"; }
  .s62 .vA .call { justify-self: start; flex-direction: row; gap: 2mm; padding: 1mm 3mm; }

  /* B: Número primeiro. A black ticket block carries the Call number; the QR is secondary. */
  .vB .call { background: #000; color: #fff; border: 0; border-radius: 0; }
  .s29 .vB { grid-template: auto auto 1fr / 19mm 1fr 20mm; grid-template-areas: "call name qr" "call meta qr" "call care qr"; padding: 0 1.5mm 0 0; }
  .s29 .vB .call b { font-size: 10mm; }
  .s29 .vB > :not(.call) { margin-top: 1.5mm; margin-bottom: 1.5mm; }
  .s62 .vB { grid-template: 17mm auto auto 1fr / 1fr 30mm; grid-template-areas: "call call" "name name" "meta qr" "care qr"; padding: 0 2.5mm 2.5mm; }
  .s62 .vB .call { flex-direction: row; justify-content: flex-start; gap: 3mm; margin: 0 -2.5mm; padding: 0 3mm; }
  .s62 .vB .call b { font-size: 13mm; }

  /* C: Faixa de cuidado. A black edge band: fixed Care stamp slots on the Child tag, "RETIRADA" on the Guardian tag. */
  .vC .band { grid-area: band; background: #000; color: #fff; display: flex; flex-direction: column;
    justify-content: space-around; align-items: center; margin: -1.5mm 0 -1.5mm -1.5mm; }
  .s62 .vC .band { margin: -2.5mm 0 -2.5mm -2.5mm; }
  .vC .band .rot { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 700; letter-spacing: .5mm; font-size: 3mm; }
  .s62 .vC .band .rot { font-size: 5mm; }
  .s29 .vC { grid-template: auto auto 1fr / 7mm 1fr 22mm; grid-template-areas: "band name qr" "band meta qr" "band care qr"; }
  .s62 .vC { grid-template: auto auto 1fr / 12mm 1fr 32mm; grid-template-areas: "band name name" "band meta qr" "band care qr"; }
  .s29 .vC .band .stamp { width: 5mm; height: 5mm; }
  .s62 .vC .band .stamp { width: 8.5mm; height: 8.5mm; }
  .vC .num { font-size: 1.6em; vertical-align: -0.15em; margin-right: 1mm; }

  /* ---- C1 / C2 / C3: directions evolved from C. Shared parts first. ---- */
  .s29 .cx { --ts: 2.5mm; --tn: 2.7mm; --tx: 2.1mm; --tc: 3.8mm; --m: 1.5mm; }
  .s62 .cx { --ts: 3.8mm; --tn: 4.2mm; --tx: 3mm; --tc: 6.5mm; --m: 2.5mm; }
  .cx { line-height: 1.1; }
  .cx .name, .cx .first, .cx .rest { font-weight: 700; white-space: nowrap; overflow: hidden; line-height: 1.1; letter-spacing: -0.01em; }
  .cx .fit.two { white-space: normal; text-wrap: balance; max-height: 2.25em; }
  .cx .band, .cx .block { background: #000; color: #fff; }
  .cx .slots { display: flex; align-items: center; justify-content: space-around; }
  .cx .q { aspect-ratio: 1; flex: none; }
  .cx .q svg { display: block; width: 100%; height: 100%; }
  .cx .who, .cx .kp { font-size: var(--ts); }
  .cx .who { white-space: nowrap; overflow: hidden; }
  .cx .note { font-size: var(--tn); text-wrap: balance; }
  .cx .num { font-weight: 700; line-height: .8; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cx .num small { font-size: .3em; vertical-align: top; margin-right: .15em; }
  .cx .lock { white-space: nowrap; font-size: var(--ts); }
  .cx .lock b { font-size: 1.9em; font-variant-numeric: tabular-nums; }
  .cx .body { grid-area: body; display: flex; flex-direction: column; gap: 1mm; overflow: hidden; }
  .cx .body > * { flex: none; }
  .cx .body .kp { margin-top: auto; }
  .cx .row { display: flex; align-items: baseline; gap: 2mm; }
  .cx.grd .lock b { font-size: 2.4em; }
  /* Pickup code: mono, letter-spaced, reversed. Never set like the Call number. */
  .cx .pick { grid-area: pick; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8mm; }
  .cx .pcode { font: 700 var(--tc)/1.1 ui-monospace, "Courier New", monospace; letter-spacing: .12em; background: #000; color: #fff;
    padding: .3mm 1mm .3mm 1.5mm; border-radius: .6mm; }
  /* Claim QR: dashed frame, so it reads as a third kind of code. */
  .cx .clm { grid-area: clm; display: flex; flex-direction: column; justify-content: center; gap: .6mm; font-size: var(--tx); line-height: 1.15; }
  .cx .clm .q { border: .3mm dashed #000; padding: .4mm; box-sizing: border-box; }
  .s29 .cx .clm { width: 13mm; } .s29 .cx .clm .more { display: none; }
  .s62 .cx .clm { flex-direction: row; align-items: center; justify-content: flex-start; gap: 2mm; }
  .s62 .cx .clm .q { width: 16mm; }
  .cx .rot { writing-mode: vertical-rl; font-weight: 700; letter-spacing: .14em; }

  /* C1: Faixa e coluna. Slim stamp band on the left edge; Call number stacked over the QR in a right column.
     Guardian tag is the mirror image: pickup QR on the left, band on the right edge. */
  .s29 .vC1.kid { grid-template: "band name side" auto "band who side" auto "band note side" 1fr / 8.5mm 1fr 16mm; padding-left: 0; column-gap: 2mm; }
  .s62 .vC1.kid { grid-template: "band name name" auto "band who who" auto "band note side" 1fr / 14mm 1fr 21mm; padding-left: 0; column-gap: 3.5mm; }
  .vC1 .band { grid-area: band; margin: calc(-1 * var(--m)) 0; display: flex; align-items: center; justify-content: space-around; }
  .vC1.kid .band { flex-direction: column; padding: var(--m) 0 var(--m) var(--m); }
  .s29 .vC1 .band .stamp { width: 5mm; height: 5mm; }
  .s62 .vC1 .band .stamp { width: 9mm; height: 9mm; }
  .vC1.kid .who { grid-area: who; }
  .vC1.kid .note { grid-area: note; align-self: end; }
  .vC1 .side { grid-area: side; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; }
  .s29 .vC1 .side .num { font-size: 8.5mm; } .s29 .vC1 .side .q { width: 16mm; }
  .s62 .vC1 .side .num { font-size: 12.5mm; } .s62 .vC1 .side .q { width: 21mm; }
  .s62 .vC1 .side { justify-content: flex-end; gap: 2mm; }
  .s29 .vC1.grd { grid-template: "pick body clm band" 1fr / 18.5mm 1fr auto 8.5mm; padding-right: 0; column-gap: 2mm; }
  .s62 .vC1.grd { grid-template: "pick body band" 1fr "pick clm band" auto / 34mm 1fr 14mm; padding-right: 0; column-gap: 3.5mm; }
  .vC1.grd .band { padding-right: var(--m); }
  .s29 .vC1 .rot { font-size: 3mm; } .s62 .vC1 .rot { font-size: 5mm; }
  .vC1.grd .pick .q { width: 100%; }
  .s29 .vC1.grd .num { font-size: 6.5mm; } .s62 .vC1.grd .num { font-size: 12mm; }

  /* C2: Faixa no topo. The band runs along the top edge and carries the screen lockup "247 · Ana" plus the four slots;
     the name gets the full label width. Guardian tag has no band at all: a heavy frame. */
  .s29 .vC2.kid { grid-template: "band band" 8.5mm "name name" auto "foot qr" 1fr / 1fr auto; padding-top: 0; }
  .s62 .vC2.kid { grid-template: "band band" 15mm "name name" auto "foot qr" 1fr / 1fr auto; padding-top: 0; }
  .vC2.kid .band { grid-area: band; margin: 0 calc(-1 * var(--m)); display: flex; align-items: center; justify-content: space-between;
    padding: calc(var(--m) + .9mm) calc(var(--m) + .5mm) .9mm; }
  .vC2.kid .band .lock { font-size: 3.6mm; } .s62 .vC2.kid .band .lock { font-size: 5mm; }
  .vC2.kid .band .lock b { font-size: 1.7em; line-height: .8; }
  .vC2.kid .slots { gap: 1.6mm; } .s62 .vC2.kid .slots { gap: 2mm; }
  .s29 .vC2 .band .stamp { width: 4.8mm; height: 4.8mm; }
  .s62 .vC2 .band .stamp { width: 9mm; height: 9mm; }
  .cx .foot { grid-area: foot; display: flex; flex-direction: column; justify-content: space-between; gap: .6mm; overflow: hidden; }
  .cx.kid > .q { grid-area: qr; align-self: end; }
  .s29 .vC2.kid > .q { width: 10mm; } .s62 .vC2.kid > .q { width: 22mm; }
  .vC2.grd { display: block; }
  .vC2 .frame { height: 100%; box-sizing: border-box; border: .9mm solid #000; display: grid; }
  .s29 .vC2 .frame { grid-template: "pick body clm" 1fr / 21.5mm 1fr auto; padding: 1mm; column-gap: 2mm; }
  .s62 .vC2 .frame { grid-template: "pick body" 1fr "pick clm" auto / 36mm 1fr; padding: 2mm; gap: 2mm 3.5mm; }
  .vC2 .frame > * { min-width: 0; min-height: 0; }
  .s29 .vC2 .body { gap: .6mm; }
  .vC2 .frame .pick .q { width: 100%; }
  .vC2 .pbar { background: #000; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: .5mm 1.2mm; }
  .vC2 .pbar small { font-size: var(--tx); font-weight: 700; letter-spacing: .14em; }
  .vC2 .pbar .pcode { padding: 0; }

  /* C3: Bloco de chamada. A wide black block is the volunteer zone: Call number over a 2x2 grid of slots.
     The name splits in two tiers: first name huge, the rest on a smaller line. Guardian tag mirrors it: block on the right holds the pickup QR. */
  .s29 .vC3.kid { grid-template: "block first first" auto "block rest qr" auto "block foot qr" 1fr / 20.5mm 1fr 13.5mm; padding-left: 0; column-gap: 2mm; row-gap: .3mm; }
  .s62 .vC3.kid { grid-template: "block first first" auto "block rest rest" auto "block foot qr" 1fr / 28mm 1fr 22mm; padding-left: 0; column-gap: 3.5mm; row-gap: .6mm; }
  .vC3 .block { grid-area: block; margin: calc(-1 * var(--m)) 0; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
  .vC3.kid .block { padding: var(--m) var(--m) var(--m) calc(var(--m) + .5mm); }
  .vC3 .block .num { width: 100%; text-align: center; overflow: hidden; line-height: 1.16; margin: -.08em 0; }
  .vC3 .block .slots { display: grid; grid-template-columns: auto auto; gap: 1mm; }
  .s62 .vC3 .block .slots { gap: 1.5mm; }
  .s29 .vC3 .block .stamp { width: 5.6mm; height: 5.6mm; }
  .s62 .vC3 .block .stamp { width: 10.5mm; height: 10.5mm; }
  .vC3 .first { grid-area: first; line-height: 1.16; margin: -.08em 0 -.04em; }
  .s62 .vC3 .note { -webkit-line-clamp: 5; }
  .vC3 .rest { grid-area: rest; }
  .vC3.kid .foot { justify-content: flex-end; }
  .s29 .vC3.kid > .q { width: 13.5mm; } .s62 .vC3.kid > .q { width: 22mm; }
  .s29 .vC3.grd { grid-template: "body clm block" 1fr / 1fr auto 22mm; padding-right: 0; column-gap: 2mm; }
  .s62 .vC3.grd { grid-template: "body block" 1fr "clm block" auto / 1fr 38mm; padding-right: 0; column-gap: 3.5mm; }
  .vC3.grd .block { padding: var(--m) calc(var(--m) + 1.5mm) var(--m) 1.5mm; justify-content: center; gap: .8mm; }
  .vC3.grd .block small { font-size: var(--tx); font-weight: 700; letter-spacing: .14em; }
  .vC3.grd .block .q { width: 100%; background: #fff; padding: .4mm; box-sizing: border-box; border-radius: .6mm; }
  .vC3.grd .block .pcode { padding: 0; }

  .overflow { outline: 0.4mm solid #e00; outline-offset: -0.4mm; }
  .switcher { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 3; background: #111; color: #fff;
    border-radius: 999px; padding: 6px 8px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.35); font-size: 14px; }
  .switcher button { background: #333; color: #fff; border: 0; border-radius: 999px; width: 30px; height: 30px; cursor: pointer; }

  @media print {
    .controls, .state, .legend, .slot h3, .switcher { display: none !important; }
    body { background: #fff; }
    .sheet { padding: 0; display: block; }
    .tag { zoom: 1 !important; box-shadow: none; break-after: page; }
    .overflow { outline: 0; }
  }
</style>
</head>
<body>
<div class="controls">
  <fieldset><legend>Layout</legend>
    <label><input type="radio" name="v" value="A"> A · Nome primeiro</label>
    <label><input type="radio" name="v" value="B"> B · Número primeiro</label>
    <label><input type="radio" name="v" value="C"> C · Faixa de cuidado</label>
    <label><input type="radio" name="v" value="C1"> C1 · Faixa e coluna</label>
    <label><input type="radio" name="v" value="C2"> C2 · Faixa no topo</label>
    <label><input type="radio" name="v" value="C3"> C3 · Bloco de chamada</label>
  </fieldset>
  <fieldset><legend>Etiqueta</legend>
    <label><input type="radio" name="stock" value="29"> 29 x 90 mm</label>
    <label><input type="radio" name="stock" value="62"> 62 x 100 mm</label>
  </fieldset>
  <fieldset><legend>Selos</legend>
    <label><input type="radio" name="stamps" value="shapes"> Formas</label>
    <label><input type="radio" name="stamps" value="letters"> Letras</label>
    <label><input type="radio" name="stamps" value="pictos"> Pictogramas</label>
  </fieldset>
  <fieldset><legend>Caso</legend>
    <select name="case">
      <option value="tipico">Típico: 1 criança, 1 selo</option>
      <option value="irmaos">Pior caso: 4 irmãos, nome longo, todos os selos</option>
      <option value="visitante">Visitante da mesa (contato, QR de cadastro)</option>
    </select>
  </fieldset>
  <fieldset><legend>Zoom</legend><input type="range" name="zoom" min="1" max="4" step="0.25"></fieldset>
  <button onclick="print()">Imprimir / PDF</button>
</div>
<div class="legend" id="legend"></div>
<div class="state" id="state"></div>
<div class="sheet" id="sheet"></div>
<div class="switcher"><button id="prev">←</button><span id="vlabel"></span><button id="next">→</button></div>

<script>
const VARIANTS = { A: 'Nome primeiro', B: 'Número primeiro', C: 'Faixa de cuidado', C1: 'Faixa e coluna', C2: 'Faixa no topo', C3: 'Bloco de chamada' };
const STAMPS = ['neuro', 'allergy', 'medical', 'mobility'];
const STAMP_NAMES = { neuro: 'Neurodivergência', allergy: 'Alergia / restrição alimentar', medical: 'Condição médica', mobility: 'Mobilidade / apoio físico' };
const CASES = {
  tipico: { date: '24/11', call: 47, guardian: 'Ana', pickup: 'K7P4', contact: false,
    kids: [{ name: 'Laura Souza', stamps: ['allergy'], note: 'Alergia a amendoim: nada de lanche da sala' }] },
  irmaos: { date: '24/11', call: 247, guardian: 'Ana', pickup: 'X3M9', contact: false,
    kids: [
      { name: 'Maria Eduarda Vasconcelos de Albuquerque', stamps: STAMPS, note: 'Chame pelo nome, não responde a comandos de grupo; evite barulho alto' },
      { name: 'João Pedro Vasconcelos', stamps: [], note: '' },
      { name: 'Davi Vasconcelos', stamps: ['neuro'], note: 'Se chorar, leve ao cantinho calmo' },
      { name: 'Sofia Vasconcelos', stamps: [], note: '' },
    ] },
  // A Guardian contact gives no consent, so no Care stamps or Tag note; its Guardian tag carries the claim QR.
  visitante: { date: '24/11', call: 12, guardian: 'Pedro', pickup: 'R8T2', contact: true,
    kids: [{ name: 'Lucas Lima', stamps: [], note: '' }] },
};

const params = new URLSearchParams(location.search);
const state = { v: params.get('v') || 'A', stock: params.get('stock') || '29', stamps: params.get('stamps') || 'shapes',
  case: params.get('case') || 'tipico', zoom: params.get('zoom') || '2.5' };

function stamp(kind, style, empty) {
  const W = 'stroke="#000" stroke-width="1.4" fill="none"';
  // C1-C3: a solid white dot, because a dithered grey is not reliable on thermal stock.
  if (empty && state.v !== 'C') return `<svg class="stamp" viewBox="0 0 20 20"><circle cx="10" cy="10" r="1.6" fill="#fff"/></svg>`;
  if (empty) return `<svg class="stamp" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2" fill="#fff" opacity=".35"/></svg>`;
  const inner = {
    shapes: { neuro: '<circle cx="10" cy="10" r="8" fill="#000"/>', allergy: '<path d="M10 2 L18.5 17.5 H1.5Z" fill="#000"/>',
      medical: '<rect x="2.5" y="2.5" width="15" height="15" fill="#000"/>', mobility: '<path d="M10 1 L19 10 L10 19 L1 10Z" fill="#000"/>' },
    letters: Object.fromEntries(STAMPS.map(k => [k, `<rect x="1" y="1" width="18" height="18" rx="3" fill="#000"/><text x="10" y="15" text-anchor="middle" font-family="Arial" font-weight="700" font-size="14" fill="#fff">${{ neuro: 'N', allergy: 'A', medical: 'S', mobility: 'M' }[k]}</text>`])),
    pictos: {
      neuro: `<path ${W} stroke-width="2" d="M10 10 C7 5 2 5 2 10 C2 15 7 15 10 10 C13 5 18 5 18 10 C18 15 13 15 10 10Z"/>`,
      allergy: `<circle cx="10" cy="10" r="8" ${W} stroke-width="2"/><path d="M4.5 4.5 L15.5 15.5" ${W} stroke-width="2"/>`,
      medical: '<path d="M7 2 H13 V7 H18 V13 H13 V18 H7 V13 H2 V7 H7Z" fill="#000"/>',
      mobility: `<circle cx="10" cy="3.5" r="2" fill="#000"/><path ${W} stroke-width="2" d="M10 6 V12 H15 L16.5 17 M10 9 H14"/><path ${W} stroke-width="2" d="M7 9.5 A5 5 0 1 0 13 16.5"/>`,
    },
  }[style][kind];
  const inBand = state.v[0] === 'C';
  const svg = inBand ? `<rect width="20" height="20" rx="3" fill="#fff"/>${inner}` : inner;
  return `<svg class="stamp" viewBox="0 0 20 20"><title>${STAMP_NAMES[kind]}</title>${svg}</svg>`;
}

// Fake QR at the real size: finder squares plus seeded noise. Layout only, not scannable.
function qr(seed) {
  let h = 2166136261; for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  const rnd = () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296;
  const n = 25; let cells = '';
  const finder = (x, y) => (x < 8 && y < 8) || (x >= n - 8 && y < 8) || (x < 8 && y >= n - 8);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!finder(x, y) && rnd() < 0.5) cells += `M${x} ${y}h1v1h-1z`;
  const f = (x, y) => `M${x} ${y}h7v7h-7zM${x + 1} ${y + 1}v5h5v-5zM${x + 2} ${y + 2}h3v3h-3z`;
  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" shape-rendering="crispEdges"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/><path fill-rule="evenodd" d="${f(0, 0)}${f(n - 7, 0)}${f(0, n - 7)}${cells}"/></svg>`;
}

const first = name => name.split(' ')[0];
const list = names => names.length < 2 ? names.join('') : names.slice(0, -1).join(', ') + ' e ' + names.at(-1);
const call = n => `<div class="call"><small>Nº</small><b>${n}</b></div>`;
const nameMax = () => state.stock === '29' ? 7 : 11;

function childTag(c, kid) {
  if (state.v.length > 1) return childTagX(c, kid);
  const v = state.v;
  const meta = v === 'C' ? `<b class="num">${c.call}</b>${c.guardian} · ${c.date}` : `Responsável: ${c.guardian} · ${c.date}`;
  const stampsInline = v === 'C' ? '' : kid.stamps.map(s => stamp(s, state.stamps)).join('');
  const band = v === 'C' ? `<div class="band">${STAMPS.map(s => stamp(s, state.stamps, !kid.stamps.includes(s))).join('')}</div>` : '';
  return `<div class="tag v${v}">${band}
    <div class="name fit" data-max="${nameMax()}" data-min="3.2">${kid.name}</div>
    ${v === 'C' ? '' : call(c.call)}
    <div class="meta">${meta}</div>
    <div class="care">${stampsInline}${kid.note ? `<div class="note">${kid.note}</div>` : ''}</div>
    <div class="qr">${qr(kid.name + c.call)}</div>
  </div>`;
}

function guardianTag(c) {
  if (state.v.length > 1) return guardianTagX(c);
  const v = state.v;
  const kids = c.kids.length === 1 ? c.kids[0].name : list(c.kids.map(k => first(k.name)));
  const meta = v === 'C' ? `<b class="num">${c.call}</b>Guarde para a retirada · ${c.date}` : `<span class="keep">Guarde para a retirada</span> · ${c.date}`;
  const claim = c.contact ? `<div class="claim">${qr('claim' + c.pickup)}<span><b>Crie sua conta</b> e receba as chamadas no celular</span></div>` : '';
  const band = v === 'C' ? `<div class="band"><span class="rot">RETIRADA</span></div>` : '';
  return `<div class="tag v${v}">${band}
    <div class="name fit" data-max="${nameMax()}" data-min="3.2">${kids}</div>
    ${v === 'C' ? '' : call(c.call)}
    <div class="meta">${meta}</div>
    <div class="care">${claim}</div>
    <div class="qr">${qr('pickup' + c.pickup)}<span class="cap">código de retirada</span><span class="code">${c.pickup}</span></div>
  </div>`;
}


// ---- C1 / C2 / C3 ----
const slots = kid => STAMPS.map(s => stamp(s, state.stamps, !kid.stamps.includes(s))).join('');
const Q = seed => `<div class="q">${qr(seed)}</div>`;
const lock = (c, tail = '') => `<span class="lock"><b>${c.call}</b> · ${c.guardian}${tail}</span>`;
const sz = (a, b) => state.stock === '62' ? b : a;

function childTagX(c, kid) {
  const v = state.v, note = kid.note ? `<div class="note chk">${kid.note}</div>` : '', code = Q(kid.name + c.call);
  if (v === 'C1') return `<div class="tag cx vC1 kid"><div class="band">${slots(kid)}</div>
    <div class="name fit" data-rule="two" data-max="${sz(7.5, 12)}" data-floor="${sz(5, 8)}" data-min="3.4">${kid.name}</div>
    <div class="who">Resp. ${c.guardian} · ${c.date}</div>${note}
    <div class="side chk"><div class="num"><small>Nº</small>${c.call}</div>${code}</div></div>`;
  if (v === 'C2') return `<div class="tag cx vC2 kid"><div class="band">${lock(c, ' · ' + c.date)}<span class="slots">${slots(kid)}</span></div>
    <div class="name fit" data-rule="drop" data-max="${sz(7, 15)}" data-floor="${sz(5, 6)}" data-min="3.4">${kid.name}</div>
    <div class="foot chk">${note}</div>${code}</div>`;
  const [f, ...rest] = kid.name.split(' ');
  return `<div class="tag cx vC3 kid"><div class="block chk"><div class="num fit" data-max="${sz(9.5, 13.5)}" data-min="5">${c.call}</div><div class="slots">${slots(kid)}</div></div>
    <div class="first fit" data-max="${sz(10, 17)}" data-min="5">${f}</div>
    <div class="rest fit" data-max="${sz(4.2, 7)}" data-min="2.6">${rest.join(' ')}</div>
    <div class="foot chk">${note}<div class="who">Resp. ${c.guardian} · ${c.date}</div></div>${code}</div>`;
}

function guardianTagX(c) {
  const v = state.v, many = c.kids.length > 1;
  const kids = many ? list(c.kids.map(k => first(k.name))) : c.kids[0].name;
  const name = `<div class="name fit" data-rule="two" data-max="${v === 'C2' ? sz(5.5, 8.5) : sz(6.5, 10)}" data-floor="${sz(4.6, 7)}" data-min="3">${kids}</div>`;
  const kp = `<div class="kp">Guarde esta etiqueta${v === 'C2' ? '' : ' para retirar ' + (many ? 'as crianças' : 'a criança')}</div>`;
  const clm = c.contact ? `<div class="clm chk">${Q('claim' + c.pickup)}<span><b>Crie sua conta</b><span class="more"> e receba as chamadas no celular</span></span></div>` : '';
  const pq = Q('pickup' + c.pickup), pcode = `<span class="pcode">${c.pickup}</span>`;
  if (v === 'C1') return `<div class="tag cx vC1 grd"><div class="pick chk">${pq}${pcode}</div>
    <div class="body chk">${name}<div class="row"><div class="num"><small>Nº</small>${c.call}</div><span class="who">${c.date}</span></div>${kp}</div>
    ${clm}<div class="band"><span class="rot">RETIRADA</span></div></div>`;
  if (v === 'C2') return `<div class="tag cx vC2 grd"><div class="frame"><div class="pick chk">${pq}</div>
    <div class="body chk"><div class="pbar"><small>RETIRADA</small>${pcode}</div>${name}${lock(c, ' · ' + c.date)}${kp}</div>${clm}</div></div>`;
  return `<div class="tag cx vC3 grd"><div class="body chk">${name}${lock(c, ' · ' + c.date)}${kp}</div>
    ${clm}<div class="block chk"><small>RETIRADA</small>${pq}${pcode}</div></div>`;
}

// Long-name rule "drop": remove the name just before the last surname (keeping its de/da/do particle).
const PARTICLE = /^(de|da|do|dos|das|e)$/i;
function dropMiddle(words) {
  let last = words.length - 1;
  while (last > 1 && PARTICLE.test(words[last - 1])) last--;
  if (last <= 1) return null;
  const w = words.slice(); w.splice(last - 1, 1);
  if (last - 2 >= 1 && PARTICLE.test(w[last - 2])) w.splice(last - 2, 1);
  return w;
}
console.assert(dropMiddle('Maria Eduarda Vasconcelos de Albuquerque'.split(' ')).join(' ') === 'Maria Eduarda de Albuquerque');
console.assert(dropMiddle('Maria de Albuquerque'.split(' ')) === null);

function shrink(el, max, min, ok) {
  let size = max; el.style.fontSize = size + 'mm';
  while (!ok(el) && size > min + 0.01) { size -= 0.2; el.style.fontSize = size + 'mm'; }
  el.dataset.size = size.toFixed(1);
  return ok(el);
}
const bodyOk = el => { const b = el.closest('.body'); return !b || b.scrollHeight <= b.clientHeight + 1; };
const oneLine = el => el.scrollWidth <= el.clientWidth && bodyOk(el);
const twoLines = el => el.scrollWidth <= el.clientWidth + 1 && el.scrollHeight <= el.clientHeight + 1 && bodyOk(el);
function fitRule(el) {
  const max = +el.dataset.max, floor = +el.dataset.floor, min = +el.dataset.min;
  if (el.dataset.rule === 'two') {   // one line down to the floor size, then two balanced lines
    if (!shrink(el, max, floor, oneLine)) { el.classList.add('two'); shrink(el, floor + 1, min, twoLines); }
  } else {                           // 'drop': one line down to the floor size, then drop middle names
    let words = el.textContent.split(' ');
    while (!shrink(el, max, floor, oneLine)) {
      const next = dropMiddle(words);
      if (!next) { shrink(el, floor, min, oneLine); break; }
      words = next; el.textContent = words.join(' ');
    }
  }
}

// Shrink each name until it fits its box, as a printing module would; red outline = still overflowing at the minimum.
function fit() {
  for (const el of document.querySelectorAll('.fit')) {
    if (el.dataset.rule) { fitRule(el); continue; }
    let size = +el.dataset.max;
    el.style.fontSize = size + 'mm';
    while (el.scrollWidth > el.clientWidth && size > +el.dataset.min) { size -= 0.2; el.style.fontSize = size + 'mm'; }
    el.dataset.size = size.toFixed(1);
  }
  let over = 0;
  for (const el of document.querySelectorAll('.tag .fit, .tag .meta, .tag .note, .tag .care, .tag.cx, .cx .chk')) {
    const o = el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1;
    el.classList.toggle('overflow', o); over += o;
  }
  return over;
}

function render() {
  for (const [k, val] of Object.entries(state)) {
    document.querySelectorAll(`[name="${k}"]`).forEach(el => el.type === 'radio' ? (el.checked = el.value === val) : (el.value = val));
  }
  history.replaceState(null, '', '?' + new URLSearchParams(state));
  const c = CASES[state.case];
  const sheet = document.getElementById('sheet');
  sheet.className = 'sheet s' + state.stock;
  sheet.style.setProperty('--zoom', state.zoom);
  sheet.innerHTML = c.kids.map((k, i) => `<div class="slot"><h3>Etiqueta da criança ${i + 1}/${c.kids.length}</h3>${childTag(c, k)}</div>`).join('')
    + `<div class="slot"><h3>Etiqueta do responsável</h3>${guardianTag(c)}</div>`;
  document.getElementById('page-size').textContent = `@page { size: ${state.stock === '29' ? '90mm 29mm' : '100mm 62mm'}; margin: 0; }`;
  document.getElementById('legend').innerHTML = STAMPS.map(s => `<span>${stamp(s, state.stamps).replace('class="stamp"', 'class="stamp" style="width:6mm;height:6mm"')} ${STAMP_NAMES[s]}</span>`).join('');
  document.getElementById('vlabel').textContent = `${state.v} (${VARIANTS[state.v]})`;
  const over = fit();
  const sizes = [...document.querySelectorAll('.fit')].map(e => e.dataset.size + 'mm').join(', ');
  document.getElementById('state').textContent =
    `layout=${state.v} stock=${state.stock === '29' ? '90x29mm' : '100x62mm'} stamps=${state.stamps} case=${state.case} · tags=${c.kids.length + 1} · name sizes=[${sizes}] · overflowing boxes=${over}`;
}

document.querySelector('.controls').addEventListener('input', e => { if (e.target.name) { state[e.target.name] = e.target.value; render(); } });
const keys = Object.keys(VARIANTS);
const step = d => { state.v = keys[(keys.indexOf(state.v) + d + keys.length) % keys.length]; render(); };
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
addEventListener('keydown', e => {
  if (e.target.closest('input[type=range], select, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
render();
</script>
</body>
</html>
