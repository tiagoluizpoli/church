# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bun run lint:fix:files -- {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: bun run validate:staged-types -- {staged_files}
    - name: css
      glob: "*.css"
      run: bun run lint:files -- {staged_files}
      fail_text: "Unformatted or invalid CSS: run `bun run lint:fix`, then stage the result."
    - name: spec-registration
      glob:
        - "apps/web/tests/**.spec.ts"
        - "apps/web/tests/fixtures/e2e-lanes.ts"
        - "tooling/validation/journey-map.ts"
      run: bun run validate:e2e-lanes && bun run validate:journey-map

post-merge:
  jobs:
    # A merge that changes dependencies leaves node_modules (and postinstall output) stale.
    - name: install
      files: git diff --name-only ORIG_HEAD HEAD
      glob: "bun.lock"
      run: bun install

pre-push:
  parallel: true
  jobs:
    - name: no-docker-validation
      # Waits at most 5 minutes behind a running gate, then fails naming the holder.
      # Exits at once when this commit's tree already passed a local gate.
      env:
        CHURCH_VALIDATE_LOCK_TIMEOUT_MS: "300000"
      run: bun run validate:no-docker

commit-msg:
  commands:
    commitlint:
      # Never `npx`: without node_modules it waits on an install prompt.
      run: |
        if [ ! -x node_modules/.bin/commitlint ]; then
          echo 'Dependencies are missing here: run `bun run worktree:bootstrap`.'
          exit 1
        fi
        node_modules/.bin/commitlint --edit {1}
