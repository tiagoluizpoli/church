# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bun run lint:fix:files -- {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: affected-validation
      run: bun run validate:affected

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
