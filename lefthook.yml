# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bun biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: turbo-check
      run: turbo check-types test
    - name: check-orval
      run: bun run orval && git diff --exit-code apps/web/src/infrastructure/api/
      fail_text: "orval output stale — run orval and commit the generated files"

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
