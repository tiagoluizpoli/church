# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bun run lint:fix:files -- {staged_files}
      stage_fixed: true

post-merge:
  jobs:
    # A merge that changes dependencies leaves node_modules (and postinstall output) stale.
    - name: install
      files: git diff --name-only ORIG_HEAD HEAD
      glob: "bun.lock"
      run: bun install

pre-push:
  parallel: true
  jobs:
    - name: affected-validation
      run: bun run validate:affected

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
