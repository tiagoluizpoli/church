<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protótipo · Preparar escala</title><style>
:root{font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:#293c50;background:#f7f9fa;font-size:15px}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,input,select{font:inherit}button,select,input{border:1px solid #cdd8de;border-radius:6px;background:white;color:inherit;min-height:40px;padding:8px 12px}button{cursor:pointer}button:hover{background:#edf3f6}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7297b4}button.primary{background:#284f72;color:white;border-color:#284f72}button:disabled,input:disabled,select:disabled{opacity:.55;cursor:not-allowed}.shell{display:flex;min-height:100vh}.sidebar{width:220px;background:#f0f4f6;border-right:1px solid #dae2e6;padding:22px 16px;flex-shrink:0}.brand{font-weight:bold;font-size:19px;margin-bottom:34px}.nav{padding:11px;border-radius:6px;color:#53697a}.nav.active{background:#dfeaf0;color:#244967;font-weight:bold}.main{flex:1;min-width:0}.top{height:60px;border-bottom:1px solid #dce4e8;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.content{padding:24px 32px 100px;max-width:1500px;margin:auto}.notice{background:#eaf2f6;border:1px solid #cbdde8;padding:10px 14px;border-radius:7px;margin-bottom:18px;font-size:13px}.heading{display:flex;justify-content:space-between;align-items:start;gap:12px}.heading h1{font-size:23px;margin:0 0 5px}.muted{color:#687d8c}.heading p{margin:0}.tabs{display:flex;gap:22px;border-bottom:1px solid #dbe3e7;margin:26px 0 20px}.tabs span{padding:0 0 12px}.tabs .current{border-bottom:2px solid #315a7b;font-weight:bold}.workspace{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}.workspace.side{grid-template-columns:minmax(300px,1fr) minmax(390px,480px)}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.sectionhead h2{font-size:18px;margin:0}.filters{display:flex;gap:8px;margin-bottom:20px}.filters input{flex:1;min-width:0}.filters button{white-space:nowrap}.week{font-size:14px;font-weight:bold;margin:24px 0 9px}.row{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:14px;margin:8px 0;padding:13px 15px;background:white}.row.selected{border-color:#537e9d;background:#f0f6fa;box-shadow:inset 3px 0 #386584}.row strong,.row small{display:block}.row small{color:#687d8c;margin-top:5px}.summary{font-size:13px;white-space:nowrap;color:#526a79}.editor{background:white;border:1px solid #d5e0e5;border-radius:8px;padding:20px;box-shadow:0 2px 8px #263f5010}.side .editor{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}.editor h2{font-size:18px;margin:0 0 5px}.editor h3{font-size:15px;margin:22px 0 8px}.editor p{margin:6px 0;color:#687d8c}.editor label{display:block;font-weight:600;margin:14px 0 6px}.editor select{width:100%}.editor .check{display:flex;align-items:center;gap:10px;font-weight:normal}.check input{min-height:auto;width:18px;height:18px}.grid{border-collapse:collapse;width:100%;font-size:13px}.grid th,.grid td{border-bottom:1px solid #e1e8eb;text-align:left;padding:8px 4px}.grid input{width:62px;min-height:36px;padding:5px}.actions{display:flex;gap:8px;margin-top:22px;align-items:center;flex-wrap:wrap}.status{font-size:13px;color:#5a7180}.error{color:#a73636}.shade{position:fixed;inset:0;background:#10263877;display:flex;justify-content:flex-end;z-index:4}.drawer{height:100%;width:min(530px,100%);overflow:auto;background:white;padding:24px}.drawer .editor{border:0;box-shadow:none;padding:0}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:8;background:#203a51;color:white;border-radius:30px;display:flex;align-items:center;gap:8px;padding:5px;box-shadow:0 5px 18px #0003;white-space:nowrap}.switcher button{border:0;background:transparent;color:white;min-height:36px;font-size:20px}.switcher span{font-size:13px;min-width:190px;text-align:center}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0;font-size:13px}.tools button{min-height:32px;padding:4px 8px;font-size:12px}.inline{margin:0 0 16px 20px}.empty{padding:50px 15px;text-align:center;color:#718491}.back{display:none}.simulation{font-size:12px;color:#647c8a}.editor .readonly{background:#edf3f6;padding:10px;border-radius:6px}.sr{position:absolute;left:-9999px}
@media(max-width:800px){.sidebar{display:none}.top{padding:0 16px}.content{padding:20px 16px 90px}.heading{display:block}.heading>button{margin-top:14px}.workspace.side{display:block}.side .editor{position:static;max-height:none}.mobile-edit .listing{display:none}.mobile-edit .back{display:inline-block}.mobile-edit .workspace.side .editor{margin-top:10px}.summary{white-space:normal;text-align:right}.inline{margin-left:0}.tabs{overflow:auto;white-space:nowrap}.drawer{padding:20px}.switcher span{min-width:160px}.filters{flex-wrap:wrap}}
</style></head><body><div id="app"></div><script>
// Throwaway comparison of three preparation layouts. All values are illustrative and in memory.
const names=['Painel lateral','Expansão na lista','Sobreposição'];let variant=new URLSearchParams(location.search).get('variant')||'A';if(!'ABC'.includes(variant))variant='A';let selected=null,dirty=false,serves=true,split='2',counts=[2,1,1,2],loading=false,loadError=false,saving=false,saveError=false,forceSaveError=false,message='',past=false;
const rows=Array.from({length:20},(_,i)=>({id:i,title:i<2?'Retiro de líderes':i%3===0?'Encontro de oração':'Culto de domingo',label:i===0?'Manhã':i===1?'Tarde':i%2?'Noite':'Manhã',date:i<2?'14 nov':`${15+Math.floor((i-2)/2)} nov`,time:i===1?'14:00 – 17:00':i%2?'18:00 – 20:00':'09:00 – 11:00',included:i%5!==4,split:'2',counts:[2,1,1,2]}));
const app=document.querySelector('#app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function switchVariant(step){if(!leave())return;let n=('ABC'.indexOf(variant)+step+3)%3;variant='ABC'[n];history.replaceState(null,'',`?variant=${variant}`);selected=null;render()}function leave(){if(saving){alert('Aguarde o salvamento terminar.');return false}if(dirty&&!confirm('Descartar alterações não salvas?'))return false;dirty=false;return true}function choose(i){if(selected!==null&&!leave())return;selected=i;serves=rows[i].included;split=rows[i].split;counts=[...rows[i].counts];message='';saveError=false;render()}function closeEditor(){if(!leave())return;selected=null;message='';render();document.querySelector(`#block-${lastSelected}`)?.focus()}let lastSelected=0;
function editor(){if(selected===null)return '<div class="editor empty">Selecione um horário para preparar.</div>';let r=rows[selected],disabled=past?'disabled':'';return `<div class="editor"><div class="sectionhead"><div><h2>${esc(r.title)} · ${esc(r.label)}</h2><p>${r.date} · ${r.time}</p></div><button data-action="close" aria-label="Fechar editor">✕</button></div>${past?'<p class="readonly">Escala encerrada · somente leitura</p>':''}<label class="check"><input type="checkbox" data-field="serves" ${serves?'checked':''} ${disabled}> Ministério participa deste horário</label>${serves?`<h3>Turnos</h3><p>Divida este horário para organizar a participação.</p><label for="split">Divisão dos turnos</label><select id="split" data-field="split" ${disabled}><option value="1" ${split==='1'?'selected':''}>Um turno · horário completo</option><option value="2" ${split==='2'?'selected':''}>2 turnos iguais</option><option value="manual" ${split==='manual'?'selected':''}>Horários manuais</option></select>${split==='manual'?'<p>Turno 1: 09:00 – 10:00 · Turno 2: 10:00 – 11:00 (exemplo)</p>':''}<h3>Pessoas necessárias</h3><p>Defina a quantidade por setor e função em cada turno.</p><table class="grid"><thead><tr><th>Setor / função</th><th>Turno 1</th>${split!=='1'?'<th>Turno 2</th>':''}</tr></thead><tbody><tr><td>Recepção<br><span class="muted">Anfitrião</span></td><td><input aria-label="Recepção, anfitrião, turno 1" type="number" min="0" value="${counts[0]}" data-count="0" ${disabled}></td>${split!=='1'?`<td><input aria-label="Recepção, anfitrião, turno 2" type="number" min="0" value="${counts[1]}" data-count="1" ${disabled}></td>`:''}</tr><tr><td>Templo<br><span class="muted">Apoio</span></td><td><input aria-label="Templo, apoio, turno 1" type="number" min="0" value="${counts[2]}" data-count="2" ${disabled}></td>${split!=='1'?`<td><input aria-label="Templo, apoio, turno 2" type="number" min="0" value="${counts[3]}" data-count="3" ${disabled}></td>`:''}</tr></tbody></table>`:'<p>Este ministério não serve neste horário.</p>'}<div class="actions">${past?'':`<button class="primary" data-action="save" ${saving?'disabled':''}>${saving?'Salvando…':saveError?'Tentar salvar novamente':'Salvar alterações'}</button>`}<button data-action="close" ${saving?'disabled':''}>${past?'Voltar':'Cancelar'}</button><span role="status" class="status ${saveError?'error':''}">${esc(message|| (dirty?'Alterações não salvas':''))}</span></div><p class="simulation">Simulação: nenhuma alteração é enviada ao servidor.</p></div>`}
function list(){if(loading)return '<div class="empty" role="status">Carregando horários…</div>';if(loadError)return '<div class="notice error">Não foi possível carregar os horários. <button data-action="retry-load">Tentar novamente</button></div>';return rows.map((r,i)=>`${i%4===0?`<div class="week">Semana de ${r.date} a ${18+Math.floor(i/2)} nov</div>`:''}<button id="block-${i}" class="row ${selected===i?'selected':''}" data-row="${i}" aria-expanded="${selected===i}"><span><strong>${esc(r.title)} · ${esc(r.label)}</strong><small>${r.date} · ${r.time}</small></span><span class="summary">${r.included?`${r.split==='1'?'1 turno':'2 turnos'} · ${r.counts.reduce((a,b)=>a+Number(b),0)} pessoas`:'Não participa'}　›</span></button>${variant==='B'&&selected===i?`<div class="inline">${editor()}</div>`:''}`).join('')}
function render(){let scroll=window.scrollY;app.className=selected!==null&&variant==='A'?'mobile-edit':'';app.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">✳ Church</div><div class="nav">Visão geral</div><div class="nav">Pessoas</div><div class="nav">Ministérios</div><div class="nav">Eventos</div><div class="nav active">Escalas</div><div class="nav">Configurações</div></aside><main class="main"><header class="top"><strong>Church</strong><span>Comunidade Esperança　⌄</span></header><div class="content"><div class="notice"><strong>Protótipo de decisão · dados ilustrativos.</strong> Compare as três opções; nada é salvo no servidor.</div><div class="heading"><div><h1>Escala de Recepção · Novembro 2026</h1><p class="muted">1 – 30 nov 2026 · Prepare a participação do ministério.</p></div><button>Voltar às escalas</button></div><div class="tabs"><span class="current">Preparar</span><span>Disponibilidade</span><span>Escalar</span></div><div class="tools" aria-label="Controles de simulação"><span>Simular:</span><button data-action="past">${past?'Escala atual':'Escala encerrada'}</button><button data-action="load">Carregamento / erro</button><button data-action="fail-save">${forceSaveError?'Próximo salvamento falha ✓':'Falhar próximo salvamento'}</button></div><button class="back" data-action="close">← Voltar aos horários</button><div class="workspace ${variant==='A'?'side':''}"><section class="listing"><div class="sectionhead"><div><h2>Horários</h2><span class="muted">Selecione um horário para preparar.</span></div></div><div class="filters"><input id="filter" placeholder="Buscar evento" aria-label="Buscar evento"><button>Todos os horários ⌄</button></div><div id="rows">${list()}</div></section>${variant==='A'?`<section>${editor()}</section>`:''}</div></div></main></div>${variant==='C'&&selected!==null?`<div class="shade"><section class="drawer" role="dialog" aria-modal="true" aria-label="Preparar horário">${editor()}</section></div>`:''}<div class="switcher" aria-label="Comparar variantes"><button data-action="prev" aria-label="Variante anterior">←</button><span>${variant} · ${names['ABC'.indexOf(variant)]}</span><button data-action="next" aria-label="Próxima variante">→</button></div>`;window.scrollTo(0,scroll)}
app.addEventListener('click',e=>{let row=e.target.closest('[data-row]');if(row){lastSelected=+row.dataset.row;choose(lastSelected);return}let action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='prev'||action==='next')switchVariant(action==='prev'?-1:1);if(action==='close')closeEditor();if(action==='past'){if(!leave())return;past=!past;render()}if(action==='fail-save'){forceSaveError=!forceSaveError;render()}if(action==='load'||action==='retry-load'){loading=true;loadError=false;render();setTimeout(()=>{loading=false;loadError=action==='load';render()},700)}if(action==='save'){saving=true;message='Salvando…';render();setTimeout(()=>{saving=false;if(forceSaveError){saveError=true;forceSaveError=false;message='Não foi possível salvar. Tente novamente.'}else{saveError=false;dirty=false;rows[selected].included=serves;rows[selected].split=split;rows[selected].counts=[...counts];message='Alterações salvas nesta simulação.'}render()},700)}});
app.addEventListener('change',e=>{if(e.target.dataset.field==='serves'){if(!e.target.checked&&!confirm('Deixar de participar deste horário? A preparação deste horário será removida.')){e.target.checked=true;return}serves=e.target.checked;dirty=true;message='';render()}if(e.target.dataset.field==='split'){split=e.target.value;dirty=true;message='';render()}if(e.target.dataset.count!==undefined){counts[+e.target.dataset.count]=e.target.value;dirty=true;message='';render()}});app.addEventListener('input',e=>{if(e.target.id==='filter'){let q=e.target.value.toLowerCase();document.querySelectorAll('[data-row]').forEach(el=>el.hidden=!el.innerText.toLowerCase().includes(q))}});document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchVariant(e.key==='ArrowLeft'?-1:1)}if(e.key==='Escape'&&selected!==null)closeEditor()});window.addEventListener('beforeunload',e=>{if(dirty||saving){e.preventDefault();e.returnValue=''}});render();
</script></body></html>
