<!doctype html>
<!--
  PROTOTYPE, throwaway. Wayfinder ticket "Prototype: export layouts at real size" (#1106, map #1101).
  Question: which layout makes an exported Ministry Schedule clear on a phone (PNG) and on paper (PDF)?
  Four structurally different layouts of the same fake November Cycle, switchable via ?variant=A|B|C|D.
  Other params: ?data=kids|proj  ?draft=1  ?split=all|group|week&part=N  ?chrome=0 (hide controls, used by render.ts)
  Open the file directly in a browser, or run `bun prototypes/schedule-export-layouts/render.ts` for PNG/PDF output.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · schedule export layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1b2230; --muted: #5d6677; --line: #d9dee7; --paper: #ffffff; --bg: #e9ecf1;
    --brand: oklch(0.378 0.09 255); --brand-soft: oklch(0.948 0.018 247);
    --s0: #b4235a; --s1: #1f6fb2; --s2: #2f7d32; --s3: #a35a00; /* sector repeat colours; label carries meaning */
    --cancel: #b42318;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: "Atkinson Hyperlegible", system-ui, sans-serif; color: var(--ink); }
  #controls { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 8px 12px; background: #111827; color: #fff; font: 13px system-ui; }
  #controls select, #controls label { font: inherit; }
  #stage { padding: 24px; display: flex; justify-content: center; }
  /* phone image: 540 CSS px rendered at 2x = 1080 px wide */
  .sheet { flex: none; width: 540px; background: var(--paper); padding: 28px 24px 32px; box-shadow: 0 2px 12px rgb(0 0 0 / .12); position: relative; }
  .sheet.a4 { width: 297mm; min-height: 210mm; padding: 12mm 12mm; }
  .head { display: flex; gap: 14px; align-items: center; border-bottom: 3px solid var(--brand); padding-bottom: 14px; margin-bottom: 6px; }
  .head img { width: 56px; height: 56px; }
  .head h1 { margin: 0; font-size: 24px; line-height: 1.15; color: var(--brand); }
  .head .range { font-size: 16px; color: var(--muted); margin-top: 2px; }
  .single { font-size: 16px; color: var(--muted); margin: 8px 0 0; }
  .stamp { margin-left: auto; align-self: flex-start; border: 3px solid var(--cancel); color: var(--cancel); font-weight: 700; font-size: 18px; letter-spacing: .08em; padding: 2px 10px; border-radius: 6px; text-transform: uppercase; background: #fff; }
  .group { margin-top: 22px; }
  .group > h2 { margin: 0 0 8px; font-size: 20px; color: #fff; background: var(--brand); padding: 6px 12px; border-radius: 6px; }
  .vaga { color: var(--muted); font-style: italic; }
  .cancelled { color: var(--cancel); font-weight: 700; }
  .sec-0 { --sc: var(--s0); } .sec-1 { --sc: var(--s1); } .sec-2 { --sc: var(--s2); } .sec-3 { --sc: var(--s3); }

  /* A: agenda, one name per line */
  .A .event { border-bottom: 1px solid var(--line); padding: 12px 0; }
  .A .date { font-size: 19px; font-weight: 700; }
  .A .title { font-size: 15px; color: var(--muted); }
  .A .block { margin-top: 10px; }
  .A .blabel { font-size: 17px; font-weight: 700; color: var(--brand); }
  .A .sector { margin: 6px 0 0 0; padding-left: 10px; border-left: 4px solid var(--sc); }
  .A .sector b { display: block; font-size: 14px; color: var(--sc); text-transform: uppercase; letter-spacing: .04em; }
  .A .sector div { font-size: 17px; line-height: 1.35; }

  /* B: per service card, sectors side by side (2 columns) */
  .B .event { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .B .ehead { background: var(--brand-soft); padding: 8px 12px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .B .date { font-weight: 700; font-size: 18px; }
  .B .title { color: var(--muted); font-size: 14px; text-align: right; }
  .B .block { padding: 8px 12px 10px; border-top: 1px solid var(--line); }
  .B .blabel { font-weight: 700; font-size: 16px; color: var(--brand); margin-bottom: 4px; }
  .B .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .B .sector b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--sc); border-bottom: 2px solid var(--sc); margin-bottom: 2px; }
  .B .sector div { font-size: 15px; line-height: 1.3; }

  /* C: rows per sector, names inline */
  .C .event { margin-top: 14px; }
  .C .ehead { display: flex; gap: 10px; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 3px; }
  .C .date { font-weight: 700; font-size: 19px; }
  .C .title { color: var(--muted); font-size: 15px; }
  .C .blabel { font-weight: 700; font-size: 16px; color: var(--brand); margin-top: 6px; }
  .C table { width: 100%; border-collapse: collapse; margin-top: 2px; }
  .C td { padding: 5px 0; vertical-align: top; border-bottom: 1px solid var(--line); font-size: 16px; line-height: 1.3; }
  .C td.sl { width: 112px; padding-right: 8px; font-weight: 700; font-size: 14px; color: var(--sc); }
  .C td.sl::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--sc); margin-right: 5px; }
  .C .n + .n::before { content: " · "; color: var(--muted); }

  /* D: A4 landscape grid, dates as columns, block x sector as rows */
  .D h2 { font-size: 15px !important; }
  .D table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 11.5px; }
  .D th, .D td { border: 1px solid var(--line); padding: 3px 5px; vertical-align: top; line-height: 1.25; }
  .D thead th { background: var(--brand-soft); font-size: 12.5px; }
  .D thead th small { display: block; font-weight: 400; color: var(--muted); }
  .D th.row { text-align: left; width: 120px; background: #fafbfc; }
  .D th.row .bl { color: var(--brand); display: block; }
  .D th.row .sn { color: var(--sc); display: block; }
  .D tr.firstsec td, .D tr.firstsec th { border-top: 2px solid var(--ink); }
  .D td.cx { color: var(--cancel); font-weight: 700; text-align: center; vertical-align: middle; }
  .D .list td { width: auto; }
  .D .head h1 { font-size: 20px; }

  /* E: D's layout restyled with the app identity (apps/web/DESIGN.md tokens) */
  .E, .F { --fg: oklch(0.286 0.032 254); --mfg: oklch(0.48 0.024 250); --bd: oklch(0.885 0.012 242); --mut: oklch(0.955 0.008 236);
       --acc: oklch(0.948 0.018 247); --pri: oklch(0.378 0.09 255); --des: oklch(0.56 0.207 26);
       --s0: oklch(0.45 0.13 255); --s1: oklch(0.5 0.1 190); --s2: oklch(0.5 0.12 145); --s3: oklch(0.5 0.13 300);
       color: var(--fg); background: oklch(0.992 0.002 220); padding: 11mm 12mm 10mm; }
  :is(.E,.F) .ehd { display: flex; align-items: center; gap: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--bd); }
  :is(.E,.F) .ehd img { width: 44px; height: 44px; border-radius: 10px; }
  :is(.E,.F) .ehd .t { flex: 1; }
  :is(.E,.F) .ehd .k { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--mfg); }
  :is(.E,.F) .ehd h1 { margin: 1px 0 0; font-size: 22px; line-height: 1.15; color: var(--fg); }
  :is(.E,.F) .ehd .range { font-size: 13px; color: var(--mfg); text-align: right; }
  :is(.E,.F) .ehd .range b { display: block; color: var(--fg); font-size: 15px; }
  :is(.E,.F) .stamp { position: static; transform: none; display: inline-block; margin-top: 4px; font-size: 11px; padding: 1px 8px; border-width: 1.5px; border-color: var(--des); color: var(--des); }
  .E .grp { margin-top: 14px; border: 1px solid var(--bd); border-radius: 10px; overflow: hidden; background: #fff; }
  .E .grp > header { display: flex; align-items: baseline; gap: 10px; padding: 7px 12px; background: var(--pri); color: #fff; }
  .E .grp > header h2 { margin: 0; font-size: 15px; }
  .E .grp > header span { font-size: 12px; opacity: .8; }
  .E table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
  .E th, .E td { padding: 4px 8px; vertical-align: top; line-height: 1.35; text-align: left; }
  .E thead th { background: var(--acc); border-bottom: 1px solid var(--bd); padding: 5px 8px; }
  .E thead .wd { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--mfg); }
  .E thead .dn { display: block; font-size: 14px; font-weight: 700; }
  .E td + td, .E thead th + th, .E .sec + td { border-left: 1px solid var(--bd); }
  .E tr.row td, .E tr.row th.sec { border-top: 1px solid var(--mut); }
  .E tr.bstart > * { border-top: 2px solid var(--pri) !important; }
  .E tbody tr:first-child > * { border-top: 0 !important; }
  .E th.time { width: 30px; padding: 0; background: var(--pri); color: #fff; text-align: center; vertical-align: middle; border-top-color: #fff !important; }
  .E tr.bstart th.time { border-top: 2px solid #fff !important; }
  .E th.time span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 13px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; padding: 6px 0; }
  .E th.sec { width: 92px; font-size: 11.5px; font-weight: 700; color: var(--sc); background: #fff; }
  .E th.sec::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 2px; background: var(--sc); margin-right: 6px; vertical-align: 1px; }
  .E th.htime { background: var(--acc); color: var(--pri); font-weight: 700; font-size: 12.5px; border-left: 3px solid var(--pri); vertical-align: middle; }
  .E td.cx { background: oklch(0.97 0.015 26); color: var(--des); font-weight: 700; text-align: center; vertical-align: middle; }
  .E .vaga { color: var(--mfg); }
  .E .evt b { display: block; }
  .E .evt small { color: var(--mfg); font-size: 11px; }

  .F { padding: 22px 18px 24px; }
  .F .ehd h1 { font-size: 21px; }
  .F .grp { margin-top: 16px; }
  .F .grp > header { display: flex; align-items: baseline; gap: 8px; padding: 7px 12px; background: var(--pri); color: #fff; border-radius: 10px; }
  .F .grp > header h2 { margin: 0; font-size: 16px; } .F .grp > header span { font-size: 12.5px; opacity: .8; }
  .F .card { margin-top: 8px; border: 1px solid var(--bd); border-radius: 10px; overflow: hidden; background: #fff; }
  .F .ch { display: flex; align-items: baseline; gap: 8px; padding: 6px 12px; background: var(--acc); border-bottom: 1px solid var(--bd); }
  .F .ch .wd { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--mfg); }
  .F .ch .dn { font-size: 17px; font-weight: 700; }
  .F .ch .tt { margin-left: auto; font-size: 12.5px; color: var(--mfg); text-align: right; }
  .F .blk { display: flex; }
  .F .blk + .blk { border-top: 2px solid var(--pri); }
  .F .band { width: 30px; flex: none; background: var(--pri); color: #fff; display: flex; align-items: center; justify-content: center; }
  .F .blk + .blk .band { box-shadow: 0 -2px 0 #fff; }
  .F .band span { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 700; font-size: 13.5px; white-space: nowrap; padding: 8px 0; }
  .F .band.wide { width: 58px; }
  .F .band em { font-style: normal; font-weight: 700; font-size: 13px; line-height: 1.2; text-align: center; padding: 8px 0; }
  .F .body { flex: 1; display: grid; grid-template-columns: 1fr 1fr; }
  .F .sec { padding: 7px 10px 8px; border-left: 1px solid var(--mut); border-top: 1px solid var(--mut); }
  .F .sec:nth-child(-n+2) { border-top: 0; }
  .F .sec:nth-child(odd) { border-left: 0; }
  .F .sec b { display: block; font-size: 12px; color: var(--sc); margin-bottom: 2px; }
  .F .sec b::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 2px; background: var(--sc); margin-right: 6px; vertical-align: 1px; }
  .F .sec div { font-size: 14.5px; line-height: 1.35; }
  .F .cx { flex: 1; padding: 12px; background: oklch(0.97 0.015 26); color: var(--des); font-weight: 700; text-align: center; }
  .F .vaga { color: var(--mfg); }

  #switcher { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; background: #111827; color: #fff; padding: 8px 14px; border-radius: 999px; box-shadow: 0 6px 20px rgb(0 0 0 / .35); font: 14px system-ui; z-index: 10; }
  #switcher button { background: #374151; color: #fff; border: 0; border-radius: 999px; width: 30px; height: 30px; cursor: pointer; }
  .nochrome #controls, .nochrome #switcher { display: none; }
  .nochrome #stage { padding: 0; }
  .nochrome .sheet { box-shadow: none; }
</style>
</head>
<body>
<div id="controls">
  <strong>PROTOTYPE</strong>
  <label>Dados <select id="data"><option value="kids">Infantil (10–13/culto)</option><option value="proj">Projeção (2/culto)</option></select></label>
  <label><input type="checkbox" id="draft" /> Rascunho</label>
  <label>Dividir <select id="split"><option value="all">Tudo numa imagem</option><option value="group">Por grupo</option><option value="week">Por semana</option></select></label>
  <label>Parte <select id="part"></select></label>
  <span id="dims"></span>
</div>
<div id="stage"></div>
<div id="switcher"><button id="prev" aria-label="Anterior">←</button><span id="vlabel"></span><button id="next" aria-label="Próxima">→</button></div>
<script>
const VARIANTS = { A: "Agenda, um nome por linha", B: "Cartão por culto, setores lado a lado", C: "Linha por setor, nomes corridos", D: "Grade A4 paisagem (papel)", E: "Grade com identidade do sistema", F: "Cartão por culto com identidade do sistema" };
const KEYS = Object.keys(VARIANTS);
const q = new URLSearchParams(location.search);
const state = { variant: q.get("variant") ?? "A", data: q.get("data") ?? "kids", draft: q.get("draft") === "1", split: q.get("split") ?? "all", part: Number(q.get("part") ?? 0),
  // used by the export-screen prototype: ?groups=<json [{name,templates}]> ([] = one plain list)  ?from=&to= (days)  ?cyc=
  groups: q.get("groups"), from: Number(q.get("from") ?? 1), to: Number(q.get("to") ?? 30), cyc: q.get("cyc") ?? "Novembro 2026", rng: q.get("rng"),
  // ?sector=<name> keeps one Sector; ?role=Professor(a)|Auxiliar keeps one Role (fake rule: first name per Sector teaches)
  sector: q.get("sector"), role: q.get("role") };
if (q.get("chrome") === "0") document.body.classList.add("nochrome");

// ---- fake data: November 2026 Cycle ----
const POOL = ["Ana Beatriz Carvalho Souza","Maria Eduarda Albuquerque Nogueira","João Pedro Santos","Lucas Gabriel Ferreira Lima","Juliana Ribeiro","Fernanda Cristina de Oliveira Martins","Rafael Almeida","Camila Rodrigues Pereira","Gabriela Monteiro Castro","Pedro Henrique Barbosa","Larissa Teixeira","Thiago Moreira Cardoso","Beatriz Lopes","Mateus Vieira da Silva","Isabela Duarte Fonseca","Carlos Eduardo Pinto","Letícia Ramos","Daniel Araújo Mendes","Vitória Cavalcanti","Felipe Rocha","Mariana Gomes de Azevedo","Bruno Correia","Aline Batista Freitas","Gustavo Nascimento","Patrícia Cunha","Rodrigo Dias Moura","Tatiane Farias","André Luiz Machado","Priscila Campos","Eduardo Sales","Natália Antunes Brandão","Samuel Coelho","Raquel Medeiros","Leonardo Prado","Débora Siqueira Bastos","Vinícius Tavares","Sabrina Lacerda","Marcos Paulo Guimarães","Helena Viana","Otávio Rezende"];
let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
const pick = (n) => { const out = []; while (out.length < n) { const x = POOL[Math.floor(rnd() * POOL.length)]; if (!out.includes(x)) out.push(x); } return out; };

function people(kind, sizeBias, projSecs = ["Templo", "Kids"]) {
  if (kind === "proj") { const all = pick(projSecs.length); return projSecs.map((s, i) => ({ sector: s, names: [all[i]] })); }
  const secs = ["Berçário", "Maternal", "Primários", "Juniores"];
  const total = 10 + Math.floor(rnd() * 4) - sizeBias;
  const per = secs.map((_, i) => Math.floor(total / 4) + (i < total % 4 ? 1 : 0));
  const all = pick(total); let at = 0; // one person per service, never in two Sectors
  return secs.map((s, i) => ({ sector: s, names: [...all.slice(at, (at += per[i])), ...(i === 1 && rnd() < .5 ? [null] : [])] }));
}
function build(kind) {
  seed = kind === "kids" ? 7 : 11;
  const sun = [1, 8, 15, 22, 29].map((d) => ({
    day: d, date: `dom, ${d} nov`, title: "Culto de domingo",
    blocks: [
      // no kids at 8h00: only Projeção serves it, in the Templo
      ...(kind === "proj" ? [{ label: "8h00", sectors: people(kind, 0, ["Templo"]) }] : []),
      { label: "10h30", sectors: people(kind, 0) },
      { label: "18h30", sectors: people(kind, 0), cancelled: d === 22 },
    ],
  }));
  const wed = [4, 11, 18, 25].map((d) => ({
    day: d, date: `qua, ${d} nov`, title: "Culto de quarta", cancelledEvent: d === 18,
    blocks: [{ label: "19h30–21h00", sectors: people(kind, 2) }],
  }));
  const other = [
    { day: 13, date: "sex 13 – dom 15 nov", title: "Retiro das famílias", blocks: [
      { label: "Programação infantil", shifts: true, sectors: null, shiftList: [
        { label: "sex · 19h00–22h00", sectors: people(kind, 3) },
        { label: "sáb · 9h00–12h00", sectors: people(kind, 3) },
        { label: "sáb · 14h00–17h00", sectors: people(kind, 3) },
      ] },
    ] },
    { day: 27, date: "sex, 27 nov", title: "Vigília de oração", blocks: [{ label: "22h00–01h00", sectors: people(kind, 4) }] },
  ];
  return {
    ministry: kind === "kids" ? "Ministério Infantil" : "Projeção",
    single: null,
    groups: [{ name: "Domingos", events: sun }, { name: "Quartas", events: wed }, { name: "Outros", events: other }],
  };
}

// flatten shifts into blocks so every renderer handles them the same way
const blocksOf = (ev) => ev.blocks.flatMap((b) => b.shiftList ? b.shiftList.map((s, i) => ({ ...s, parent: i === 0 ? b.label : null })) : [b]);
const secIdx = (name) => ["Berçário", "Maternal", "Primários", "Juniores", "Templo", "Kids"].indexOf(name) % 4;
const nm = (n) => n ?? `<span class="vaga">Vaga</span>`;
const live = (sectors) => sectors.map((s) => ({ ...s, names: s.names.filter((n) => state.draft || n) }));
const hideSector = (d) => !!d.single && !state.role || !!state.sector;

function header(d) {
  return `<div class="head"><img src="logo.png" alt=""><div><h1>${d.ministry} · Novembro 2026</h1><div class="range">1 – 30 nov 2026</div></div>${state.draft ? `<div class="stamp">Rascunho</div>` : ""}</div>`
    + (d.single ? `<p class="single">${d.single}</p>` : "");
}

const R = {
  A(ev, d) {
    if (ev.cancelledEvent) return `<div class="event"><div class="date">${ev.date}</div><div class="title">${ev.title}</div><div class="cancelled">Não haverá culto</div></div>`;
    return `<div class="event"><div class="date">${ev.date}</div><div class="title">${ev.title}</div>` + blocksOf(ev).map((b) =>
      `<div class="block">${b.parent ? `<div class="title">${b.parent}</div>` : ""}<div class="blabel">${b.label}</div>` +
      (b.cancelled ? `<div class="cancelled">Cancelado</div>` : live(b.sectors).map((s) =>
        `<div class="sector sec-${secIdx(s.sector)}">${hideSector(d) ? "" : `<b>${s.sector}</b>`}${s.names.map((n) => `<div>${nm(n)}</div>`).join("")}</div>`).join("")) + `</div>`).join("") + `</div>`;
  },
  B(ev, d) {
    const head = `<div class="ehead"><span class="date">${ev.date}</span><span class="title">${ev.title}</span></div>`;
    if (ev.cancelledEvent) return `<div class="event">${head}<div class="block cancelled">Não haverá culto</div></div>`;
    return `<div class="event">${head}` + blocksOf(ev).map((b) =>
      `<div class="block">${b.parent ? `<div class="title" style="text-align:left">${b.parent}</div>` : ""}<div class="blabel">${b.label}</div>` +
      (b.cancelled ? `<div class="cancelled">Cancelado</div>` : `<div class="grid" ${hideSector(d) ? 'style="grid-template-columns:1fr"' : ""}>` + live(b.sectors).map((s) =>
        `<div class="sector sec-${secIdx(s.sector)}">${hideSector(d) ? "" : `<b>${s.sector}</b>`}${s.names.map((n) => `<div>${nm(n)}</div>`).join("")}</div>`).join("") + `</div>`) + `</div>`).join("") + `</div>`;
  },
  C(ev, d) {
    const head = `<div class="ehead"><span class="date">${ev.date}</span><span class="title">${ev.title}</span></div>`;
    if (ev.cancelledEvent) return `<div class="event">${head}<div class="cancelled" style="margin-top:6px">Não haverá culto</div></div>`;
    return `<div class="event">${head}` + blocksOf(ev).map((b) =>
      `${b.parent ? `<div class="title" style="color:var(--muted);margin-top:6px">${b.parent}</div>` : ""}<div class="blabel">${b.label}</div>` +
      (b.cancelled ? `<div class="cancelled">Cancelado</div>` : `<table>` + live(b.sectors).map((s) =>
        `<tr class="sec-${secIdx(s.sector)}">${hideSector(d) ? "" : `<td class="sl">${s.sector}</td>`}<td>${s.names.map((n) => `<span class="n">${nm(n)}</span>`).join("")}</td></tr>`).join("") + `</table>`)).join("") + `</div>`;
  },
};

// D: per group, a grid when every event has the same blocks (Domingos, Quartas), else a list table (Outros)
function gridD(g, d) {
  const evs = g.events;
  const shape = (ev) => blocksOf(ev).map((b) => b.label).join("|");
  if (evs.some((e) => blocksOf(e).some((b) => b.parent)) || new Set(evs.map(shape)).size > 1) {
    return `<table class="list"><thead><tr><th style="width:150px">Data</th><th style="width:170px">Evento · horário</th><th>Quem serve</th></tr></thead><tbody>` +
      evs.flatMap((ev) => ev.cancelledEvent ? [`<tr><td>${ev.date}</td><td>${ev.title}</td><td class="cx">Não haverá culto</td></tr>`] : blocksOf(ev).map((b, i) =>
        `<tr><td>${i ? "" : ev.date}</td><td>${i ? "" : ev.title + "<br>"}<b>${b.label}</b></td><td>${b.cancelled ? '<span class="cancelled">Cancelado</span>' : live(b.sectors).map((s) => `<span class="sec-${secIdx(s.sector)}">${hideSector(d) ? "" : `<b style="color:var(--sc)">${s.sector}:</b> `}${s.names.map(nm).join(", ")}</span>`).join("<br>")}</td></tr>`)).join("") + `</tbody></table>`;
  }
  const tmpl = blocksOf(evs.find((e) => !e.cancelledEvent));
  const cols = evs.map((e) => `<th>${e.date}<small>${e.title}</small></th>`).join("");
  let rows = "";
  tmpl.forEach((tb, bi) => {
    tb.sectors.forEach((sec, si) => {
      rows += `<tr class="${si === 0 ? "firstsec" : ""} sec-${secIdx(sec.sector)}"><th class="row">${si === 0 ? `<span class="bl">${tb.label}</span>` : ""}${hideSector(d) ? "" : `<span class="sn">${sec.sector}</span>`}</th>`;
      evs.forEach((ev) => {
        if (ev.cancelledEvent) { if (bi === 0 && si === 0) rows += `<td class="cx" rowspan="${tmpl.reduce((a, b) => a + b.sectors.length, 0)}">Não haverá culto</td>`; return; }
        const b = blocksOf(ev)[bi];
        if (b.cancelled) { if (si === 0) rows += `<td class="cx" rowspan="${b.sectors.length}">Cancelado</td>`; return; }
        rows += `<td>${live([b.sectors[si]])[0].names.map(nm).join("<br>")}</td>`;
      });
      rows += `</tr>`;
    });
  });
  return `<table><thead><tr><th class="row"></th>${cols}</tr></thead><tbody>${rows}</tbody></table>`;
}

const dateParts = (s) => { const [wd, rest] = s.split(", "); return rest ? [wd, rest] : ["", s]; };
function gridE(g, d) {
  const evs = g.events;
  const shape = (ev) => blocksOf(ev).map((b) => b.label).join("|");
  const sameTitle = new Set(evs.map((e) => e.title)).size === 1;
  const secTh = (s) => hideSector(d) ? "" : `<th class="sec sec-${secIdx(s)}">${s}</th>`;
  const names = (sec) => live([sec])[0].names.map(nm).join("<br>") || "—";
  let html = `<div class="grp">${g.name ? "" : "<!--"}<header><h2>${g.name}</h2>${sameTitle ? `<span>${evs[0].title}</span>` : ""}</header>${g.name ? "" : "-->"}`;
  if (evs.some((e) => blocksOf(e).some((b) => b.parent)) || new Set(evs.map(shape)).size > 1) {
    // mixed events: one row per Sector, the event and its time spanning them
    const secs = [...new Set(evs.flatMap((e) => blocksOf(e).flatMap((b) => b.sectors.map((x) => x.sector))))];
    html += `<table><thead><tr><th style="width:118px">Data</th><th style="width:150px">Evento</th><th style="width:120px">Horário</th><th class="sec" style="color:var(--fg)">Setor</th><th>Quem serve</th></tr></thead><tbody>`;
    evs.forEach((ev) => {
      const bl = blocksOf(ev);
      const span = bl.reduce((a, b) => a + (b.cancelled ? 1 : b.sectors.length), 0);
      bl.forEach((b, bi) => (b.cancelled ? [null] : b.sectors).forEach((sec, si) => {
        html += `<tr class="${si === 0 ? (bi === 0 ? "bstart" : "row bstart") : "row"} ${sec ? `sec-${secIdx(sec.sector)}` : ""}">`;
        if (bi === 0 && si === 0) html += `<td rowspan="${span}"><span class="dn" style="font-weight:700">${ev.date}</span></td><td rowspan="${span}" class="evt"><b>${ev.title}</b>${bl[0].parent ? `<small>${bl[0].parent}</small>` : ""}</td>`;
        if (si === 0) html += `<th class="htime" rowspan="${b.cancelled ? 1 : b.sectors.length}">${b.label.replace(" · ", " ")}</th>`;
        html += sec ? `${secTh(sec.sector)}<td>${live([sec])[0].names.map(nm).join(" · ")}</td>` : `<td class="cx" colspan="2">Cancelado</td>`;
        html += `</tr>`;
      }));
    });
    return html + `</tbody></table></div>`;
  }
  const tmpl = blocksOf(evs.find((e) => !e.cancelledEvent));
  const total = tmpl.reduce((a, b) => a + b.sectors.length, 0);
  html += `<table><thead><tr><th class="time" style="background:var(--acc)"></th>${hideSector(d) ? "" : `<th class="sec"></th>`}${evs.map((e) => { const [wd, dn] = dateParts(e.date); return `<th><span class="wd">${wd}</span><span class="dn">${dn}</span>${sameTitle ? "" : `<small>${e.title}</small>`}</th>`; }).join("")}</tr></thead><tbody>`;
  tmpl.forEach((tb, bi) => tb.sectors.forEach((sec, si) => {
    html += `<tr class="${si === 0 ? "bstart" : "row"} sec-${secIdx(sec.sector)}">${si === 0 ? `<th class="time" rowspan="${tb.sectors.length}"><span>${tb.label}</span></th>` : ""}${secTh(sec.sector)}`;
    evs.forEach((ev) => {
      if (ev.cancelledEvent) { if (bi === 0 && si === 0) html += `<td class="cx" rowspan="${total}">Não haverá culto</td>`; return; }
      const b = blocksOf(ev)[bi];
      if (b.cancelled) { if (si === 0) html += `<td class="cx" rowspan="${b.sectors.length}">Cancelado</td>`; return; }
      html += `<td>${names(b.sectors[si])}</td>`;
    });
    html += `</tr>`;
  }));
  return html + `</tbody></table></div>`;
}
function cardF(ev, sameTitle) {
  const [wd, dn] = dateParts(ev.date);
  const bl = blocksOf(ev);
  const tt = [sameTitle ? "" : ev.title, bl[0].parent ?? ""].filter(Boolean).join(" · ");
  let h = `<div class="card"><div class="ch">${wd ? `<span class="wd">${wd}</span>` : ""}<span class="dn">${dn}</span>${tt ? `<span class="tt">${tt}</span>` : ""}</div>`;
  if (ev.cancelledEvent) return h + `<div class="blk"><div class="cx">Não haverá culto</div></div></div>`;
  return h + bl.map((b) => `<div class="blk">${b.label.length <= 5 ? `<div class="band"><span>${b.label}</span></div>` : `<div class="band wide"><em>${b.label.replace(" · ", " ").replace("–", " – ").split(" ").filter(Boolean).join("<br>")}</em></div>`}` +
    (b.cancelled ? `<div class="cx">Cancelado</div>` : `<div class="body"${state.sector ? ' style="grid-template-columns:1fr"' : ""}>` + live(b.sectors).map((x) =>
      `<div class="sec sec-${secIdx(x.sector)}">${state.sector ? "" : `<b>${x.sector}</b>`}${x.names.map((n) => `<div>${nm(n)}</div>`).join("") || "<div>—</div>"}</div>`).join("") + `</div>`) + `</div>`).join("") + `</div>`;
}
const headerE = (d) => `<div class="ehd"><img src="logo.png" alt=""><div class="t"><div class="k">Escala</div><h1>${d.ministry}</h1>${d.single ? `<div class="k" style="margin-top:2px;color:var(--pri)">${d.single}</div>` : ""}${state.draft ? `<span class="stamp">Rascunho</span>` : ""}</div><div class="range"><b>${state.cyc}</b>${state.rng ?? `${state.from} – ${state.to} nov 2026`}</div></div>`;

function parts(d) {
  if (state.split === "group") return d.groups.map((g) => ({ name: g.name, groups: [g] }));
  if (state.split === "week") {
    const weeks = [[1, 7], [8, 14], [15, 21], [22, 30]];
    return weeks.map(([a, b]) => ({ name: `${a}–${b} nov`, groups: d.groups.map((g) => ({ ...g, events: g.events.filter((e) => e.day >= a && e.day <= b) })).filter((g) => g.events.length) }));
  }
  return [{ name: "Tudo", groups: d.groups }];
}

function render() {
  const d = build(state.data);
  const all = d.groups.flatMap((g) => g.events);
  if (state.groups) { const cfg = JSON.parse(state.groups); const has = (e) => cfg.some((c) => c.templates.includes(e.title));
    d.groups = cfg.length ? [...cfg.map((c) => ({ name: c.name, events: all.filter((e) => c.templates.includes(e.title)) })), { name: "Outros", events: all.filter((e) => !has(e)) }] : [{ name: "", events: [...all].sort((a, b) => a.day - b.day) }]; }
  d.groups = d.groups.map((g) => ({ ...g, events: g.events.filter((e) => e.day >= state.from && e.day <= state.to) })).filter((g) => g.events.length);
  if (state.sector || state.role) {
    const cut = (secs) => secs.filter((x) => !state.sector || x.sector === state.sector)
      .map((x) => ({ ...x, names: state.role ? x.names.filter((_, i) => (i === 0) === (state.role === "Professor(a)")) : x.names }));
    const secsOf = (b) => b.sectors ?? b.shiftList.flatMap((x) => x.sectors);
    for (const g of d.groups) for (const e of g.events) {
      for (const b of e.blocks) { if (b.sectors) b.sectors = cut(b.sectors); if (b.shiftList) b.shiftList = b.shiftList.map((x) => ({ ...x, sectors: cut(x.sectors) })).filter((x) => x.sectors.length); }
      e.blocks = e.blocks.filter((b) => secsOf(b).length); // e.g. Projeção's 8h00 has no Kids Sector
    }
    d.groups = d.groups.map((g) => ({ ...g, events: g.events.filter((e) => e.blocks.length) })).filter((g) => g.events.length);
    d.single = [state.sector, state.role].filter(Boolean).join(" · ");
  }
  const ps = parts(d);
  state.part = Math.min(state.part, ps.length - 1);
  const p = ps[state.part];
  const v = state.variant;
  const body = v === "F" ? p.groups.map((g) => { const same = new Set(g.events.map((e) => e.title)).size === 1; return `<section class="grp">${g.name ? "" : "<!--"}<header><h2>${g.name}</h2>${same ? `<span>${g.events[0].title}</span>` : ""}</header>${g.name ? "" : "-->"}${g.events.map((e) => cardF(e, same)).join("")}</section>`; }).join("") : v === "E" ? p.groups.map((g) => gridE(g, d)).join("") : p.groups.map((g) => `<section class="group"><h2>${g.name}</h2>${v === "D" ? gridD(g, d) : g.events.map((e) => R[v](e, d)).join("")}</section>`).join("");
  document.getElementById("stage").innerHTML = `<div id="sheet" class="sheet ${v} ${["D", "E"].includes(v) ? "a4" : ""}">${["E", "F"].includes(v) ? headerE(d) : header(d)}${body}</div>`;
  document.getElementById("vlabel").textContent = `${v} (${VARIANTS[v]})`;
  for (const k of ["data", "split"]) document.getElementById(k).value = state[k];
  document.getElementById("draft").checked = state.draft;
  document.getElementById("part").innerHTML = ps.map((x, i) => `<option value="${i}" ${i === state.part ? "selected" : ""}>${x.name}</option>`).join("");
  const url = new URL(location.href);
  for (const [k, val] of Object.entries(state)) if (val !== null) url.searchParams.set(k, k === "draft" ? (val ? "1" : "0") : val);
  history.replaceState(null, "", url);
  requestAnimationFrame(() => { const s = document.getElementById("sheet"); const r = s.getBoundingClientRect(); document.getElementById("dims").textContent = ["D", "E"].includes(v) ? "" : `imagem ${r.width * 2}×${Math.round(r.height * 2)} px · 1:${(r.height / r.width).toFixed(1)}`; });
}
const cycle = (dir) => { state.variant = KEYS[(KEYS.indexOf(state.variant) + dir + KEYS.length) % KEYS.length]; render(); };
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.addEventListener("keydown", (e) => { if (e.target.closest("input,select,textarea,[contenteditable]")) return; if (e.key === "ArrowLeft") cycle(-1); if (e.key === "ArrowRight") cycle(1); });
document.getElementById("data").onchange = (e) => { state.data = e.target.value; render(); };
document.getElementById("draft").onchange = (e) => { state.draft = e.target.checked; render(); };
document.getElementById("split").onchange = (e) => { state.split = e.target.value; state.part = 0; render(); };
document.getElementById("part").onchange = (e) => { state.part = Number(e.target.value); render(); };
render();
</script>
</body>
</html>
